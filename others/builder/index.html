state = migrateState(state);
function migrateState(s){
  const base = clone(DEFAULT);
  if (!s || typeof s !== 'object') return base;
  const merged = {...base, ...s};
  merged.document = {...base.document, ...(s.document || {})};
  merged.currency = String(merged.currency ?? base.currency);
  merged.totalMode = merged.totalMode === 'manual' ? 'manual' : 'auto';
  merged.manualTotal = String(merged.manualTotal ?? '');
  merged.note = String(merged.note ?? '');
  if (!Array.isArray(merged.sections)) merged.sections = clone(base.sections);
  merged.sections = merged.sections.filter(x => x && typeof x === 'object').map(x => ({
    name: String(x.name ?? ''),
    items: (Array.isArray(x.items) ? x.items : []).filter(i => i && typeof i === 'object')
      .map(i => ({ desc: String(i.desc ?? ''), date: String(i.date ?? ''), price: String(i.price ?? '') }))
  }));
  return merged;
}
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^\d.\-]/g,'')); return isNaN(n) ? 0 : n; };
const fmtText = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) + state.currency;
const fmt = n => esc(fmtText(n));
const secSum = s => s.items.reduce((a, i) => a + num(i.price), 0);
const autoTotal = () => state.sections.reduce((a, s) => a + secSum(s), 0);
const total = () => state.totalMode === 'manual' ? num(state.manualTotal) : autoTotal();

const I = {
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- editor ---------- */
function renderEditor(){
  const cur = esc(state.currency);
  let h = `<div class="label">Itinerary</div>`;

  state.sections.forEach((s, si) => {
    h += `<div class="card sec">
      <div class="sec-h">
        <input class="inp" data-sec="${si}" value="${esc(s.name)}" placeholder="Location (leave empty for no title)">
        <span class="sec-sum" id="ss${si}">${fmt(secSum(s))}</span>
        <button class="btn icon" data-action="up" data-s="${si}" title="Move up" ${si===0?'disabled':''}>${I.up}</button>
        <button class="btn icon" data-action="down" data-s="${si}" title="Move down" ${si===state.sections.length-1?'disabled':''}>${I.down}</button>
        <button class="btn icon del" data-action="del-sec" data-s="${si}" title="Delete location">${I.trash}</button>
      </div>
      <div class="items">
        <div class="row row-head"><span>Text</span><span>Date</span><span style="text-align:right">Price</span><span></span></div>
        ${s.items.map((it, ii) => `
        <div class="row">
          <input class="inp desc" data-s="${si}" data-i="${ii}" data-f="desc" value="${esc(it.desc)}" placeholder="Text">
          <input class="inp" data-s="${si}" data-i="${ii}" data-f="date" value="${esc(it.date)}" placeholder="dd.mm.yy">
          <div class="price"><input class="inp" inputmode="decimal" data-s="${si}" data-i="${ii}" data-f="price" value="${esc(it.price)}" placeholder="0"><span>${cur}</span></div>
          <button class="btn icon del" data-action="del-item" data-s="${si}" data-i="${ii}" title="Remove">${I.x}</button>
        </div>`).join('')}
        <button class="btn dashed" data-action="add-item" data-s="${si}">${I.plus}Add line</button>
      </div>
    </div>`;
  });

  h += `<button class="btn dashed" data-action="add-sec" style="padding:12px">${I.plus}Add location</button>

  <div class="label">Total</div>
  <div class="card total-card">
    <div class="seg">
      <button data-action="mode" data-m="auto" class="${state.totalMode==='auto'?'on':''}">Auto sum</button>
      <button data-action="mode" data-m="manual" class="${state.totalMode==='manual'?'on':''}">Custom</button>
    </div>
    ${state.totalMode==='manual'
      ? `<div class="price"><input class="inp" inputmode="decimal" data-bind="manualTotal" value="${esc(state.manualTotal)}"><span>${cur}</span></div>`
      : ''}
    <div class="calc">Sum of lines: <b id="autoSum">${fmt(autoTotal())}</b></div>
    <div class="field" style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <label style="margin:0">Currency</label><input class="inp cur" data-bind="currency" value="${cur}">
    </div>
  </div>

  <div class="label">Document text</div>
  <div class="card">
    <div class="field" style="margin-bottom:14px"><label>Agency name</label><input class="inp" data-doc="agencyName" value="${esc(state.document.agencyName)}"></div>
    <div class="field" style="margin-bottom:14px"><label>Top label</label><input class="inp" data-doc="eyebrow" value="${esc(state.document.eyebrow)}"></div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>Title — line 1</label><input class="inp" data-doc="titleLine1" value="${esc(state.document.titleLine1)}"></div>
      <div class="field"><label>Title — line 2</label><input class="inp" data-doc="titleLine2" value="${esc(state.document.titleLine2)}"></div>
    </div>
    <div class="field" style="margin:14px 0"><label>Introduction / subtitle</label><textarea class="inp" data-doc="subtitle" rows="2">${esc(state.document.subtitle)}</textarea></div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>Total heading</label><input class="inp" data-doc="totalLabel" value="${esc(state.document.totalLabel)}"></div>
      <div class="field"><label>Total supporting text</label><input class="inp" data-doc="totalCaption" value="${esc(state.document.totalCaption)}"></div>
    </div>
    <div class="field" style="margin:14px 0"><label>Footer agency name</label><input class="inp" data-doc="footerBrand" value="${esc(state.document.footerBrand)}"></div>
    <div class="field" style="margin-bottom:14px"><label>Footer welcome message</label><input class="inp" data-doc="footerMessage" value="${esc(state.document.footerMessage)}"></div>
    <div class="field"><label>Footer supporting text</label><input class="inp" data-doc="footerRight" value="${esc(state.document.footerRight)}"></div>
  </div>

  <div class="label">Note</div>
  <div class="card"><div class="field"><label>Shown below the total (optional)</label>
    <textarea class="inp" data-bind="note" rows="2">${esc(state.note)}</textarea></div></div>`;

  document.getElementById('editor').innerHTML = h;
}

/* ---------- preview ---------- */
function renderPreview(){
  const p = document.getElementById('page');
  const namedSections = state.sections.filter(s => s.name.trim());
  const route = namedSections.map(s => s.name.trim());
  const D = state.document;
  const kicker = [D.agencyName, D.eyebrow].filter(t => t.trim());
  const titleLines = [D.titleLine1, D.titleLine2].filter(t => t.trim());
  let h = `
    <div class="p-cover">
      ${kicker.length ? `<div class="p-kicker"><span class="p-mark"></span> ${kicker.map(esc).join(' <span style="color:#a0adb3;letter-spacing:.08em">/</span> ')}</div>` : ''}
      ${titleLines.length ? `<div class="p-title">${titleLines.map(esc).join('<br>')}</div>` : ''}
      ${state.document.subtitle.trim() ? `<div class="p-subtitle">${esc(state.document.subtitle)}</div>` : ''}
      ${route.length ? `<div class="p-route">${route.map((name, i) => `${i ? '<span class="p-route-sep">→</span>' : ''}<span class="p-route-chip">${esc(name)}</span>`).join('')}</div>` : ''}
    </div>`;
  let sectionNo = 0;
  state.sections.forEach(s => {
    const hasName = s.name.trim();
    if (hasName) sectionNo++;
    h += `<div class="p-sec">
      ${hasName ? `<h2><span class="p-sec-num">${String(sectionNo).padStart(2,'0')}</span>${esc(s.name)}</h2>` : ''}
      ${s.items.map(it => `<div class="p-row"><span class="desc">${esc(it.desc)}</span><span class="d">${it.date ? esc(it.date) : ''}</span><span class="pr">${it.price !== '' ? fmt(num(it.price)) : ''}</span></div>`).join('')}
    </div>`;
  });
  h += `<div class="p-total"><div class="p-total-box">
      <div>${D.totalLabel.trim() ? `<div class="p-total-label">${esc(D.totalLabel)}</div>` : ''}${D.totalCaption.trim() ? `<div class="p-total-caption">${esc(D.totalCaption)}</div>` : ''}</div>
      <b>${fmt(total())}</b>
    </div></div>
    ${state.note.trim() ? `<div class="p-note">${esc(state.note)}</div>` : ''}
    <div class="p-footer"><span class="p-footer-brand">${esc(D.footerBrand)}</span><span class="p-footer-line"></span>${D.footerMessage.trim() ? `<span>${esc(D.footerMessage)}</span>` : ''}${D.footerRight.trim() ? `<span>${esc(D.footerRight)}</span>` : ''}</div>`;
  p.innerHTML = h;
  fitPreview();
}

function fitPreview(){
  const stage = document.getElementById('stage'), p = document.getElementById('page');
  p.querySelectorAll('.pb-guide').forEach(g => g.remove());
  const wrap = stage.parentElement, cs = getComputedStyle(wrap);
  const avail = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const s = Math.min(1, avail / 794);
  p.style.transform = `scale(${s})`;
  const ht = p.offsetHeight, pages = Math.max(1, Math.ceil((ht - 2) / 1123));
  for (let k = 1; k < pages; k++){
    const g = document.createElement('div');
    g.className = 'pb-guide'; g.style.top = (1123*k) + 'px';
    g.innerHTML = `<span>Page ${k+1}</span>`; p.appendChild(g);
  }
  stage.style.width = (794*s) + 'px';
  stage.style.height = (ht*s) + 'px';
  document.getElementById('pageCount').textContent = pages + (pages > 1 ? ' pages' : ' page');
}

function refreshTotals(){
  state.sections.forEach((s, si) => { const e = document.getElementById('ss'+si); if (e) e.textContent = fmtText(secSum(s)); });
  const a = document.getElementById('autoSum'); if (a) a.textContent = fmtText(autoTotal());
}

/* ---------- events ---------- */
const ed = document.getElementById('editor');
ed.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.bind) state[d.bind] = t.value;
  else if (d.doc) state.document[d.doc] = t.value;
  else if (d.sec !== undefined) state.sections[+d.sec].name = t.value;
  else if (d.f) state.sections[+d.s].items[+d.i][d.f] = t.value;
  if (d.bind === 'currency'){
    ed.querySelectorAll('.price span').forEach(sp => sp.textContent = state.currency);
  }
  refreshTotals(); renderPreview(); save();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, si = +b.dataset.s, ii = +b.dataset.i, S = state.sections;
  switch (a){
    case 'add-item': {
      S[si].items.push({ desc:'', date:'', price:'' }); rebuild();
      const all = ed.querySelectorAll(`[data-s="${si}"][data-f="desc"]`); all[all.length-1].focus();
      return; }
    case 'del-item': S[si].items.splice(ii, 1); break;
    case 'add-sec': {
      S.push({ name:'New location', items:[{ desc:'', date:'', price:'' }] }); rebuild();
      const ins = ed.querySelectorAll('[data-sec]'); ins[ins.length-1].select();
      return; }
    case 'del-sec':
      if (!confirm(`Delete “${S[si].name || 'this block'}”?`)) return;
      S.splice(si, 1); break;
    case 'up': if (si > 0) [S[si-1], S[si]] = [S[si], S[si-1]]; break;
    case 'down': if (si < S.length-1) [S[si+1], S[si]] = [S[si], S[si+1]]; break;
    case 'mode':
      if (b.dataset.m === 'manual' && state.totalMode !== 'manual' && !state.manualTotal.trim()) state.manualTotal = String(autoTotal());
      state.totalMode = b.dataset.m; break;
    case 'reset':
      if (!confirm('Reset everything to the original list?')) return;
      state = clone(DEFAULT); break;
    case 'print': window.print(); return;
    case 'download': downloadPDF(); return;
  }
  rebuild();
});

function rebuild(){ renderEditor(); renderPreview(); save(); }

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function downloadPDF(){
  /*
    Use the browser's native print-to-PDF pipeline for exports. It uses the
    same print stylesheet as the working Print button and avoids html2canvas
    cropping the left side of the itinerary on some screen sizes/browsers.
    Browsers require the user to confirm Save as PDF in the print dialog.
  */
  const button = document.querySelector('[data-action="download"]');
  const oldTitle = document.title;
  const D = state.document;
  const name = [D.titleLine1, D.titleLine2].filter(t => t.trim()).join(' ').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  document.title = name || 'Tour Itinerary';
  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }

  const restore = () => {
    document.title = oldTitle;
    if (button) { button.disabled = false; button.removeAttribute('aria-busy'); }
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore, { once: true });

  // Allow the browser to apply @media print before opening the dialog.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try {
        window.print();
        // Some browsers don't fire afterprint if the dialog is cancelled.
        setTimeout(restore, 1500);
      } catch (err) {
        console.error('PDF export failed:', err);
        restore();
        toast('Could not open PDF dialog. Please use Print.');
      }
    });
  });
}

window.addEventListener('resize', fitPreview);
renderEditor(); renderPreview();
if (document.fonts) document.fonts.ready.then(fitPreview);
</script>
