<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>English Vault — Files</title>
<style>
  :root{
    --paper:#FCFCFA;--card:#FFFFFF;--ink:#17170F;--ink-2:#57564C;--ink-3:#8A897E;
    --line:#E4E3DC;--line-2:#EFEEE8;--soft:#F4F3EC;--focus:#2E5AAC;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:26px 20px 90px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:6px 0 4px;letter-spacing:-.01em}
  .lede{color:var(--ink-2);font-size:15px;margin:0 0 20px}
  .search{width:100%;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-family:var(--sans);outline:none;margin-bottom:18px;background:var(--card)}
  .search:focus{border-color:var(--ink)}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0}
  .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;color:inherit;font-size:14.5px}
  .row:hover{background:var(--soft)}
  .tw{width:14px;display:inline-block;text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:11px;flex:none}
  .ic{width:18px;flex:none;text-align:center}
  .dir>.row{cursor:pointer;font-weight:600}
  .dir>ul{margin-left:20px;border-left:1px solid var(--line-2);padding-left:6px;display:none}
  .dir.open>ul{display:block}
  a.row .n{color:var(--ink)}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:14px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">English Vault</div>
  <h1>Project files</h1>
  <p class="lede">Browse every folder and file. Click a folder to open it, a file to view it.</p>
  <input class="search" id="q" type="text" placeholder="filter files…" autocomplete="off"/>
  <div id="tree"></div>
  <div class="count" id="count"></div>
</div>
<script>
const TREE = [{"n": "docs", "t": "d", "c": [{"n": "architecture.md", "t": "f", "p": "docs/architecture.md"}]}, {"n": "generated", "t": "d", "c": [{"n": "dictation", "t": "d", "c": [{"n": "dictation.html", "t": "f", "p": "generated/dictation/dictation.html"}]}, {"n": "halqa", "t": "d", "c": [{"n": "learning-questions.json", "t": "f", "p": "generated/halqa/learning-questions.json"}]}, {"n": "vocab", "t": "d", "c": [{"n": "cambridge-18-test-1-reading-1-vocabs.html", "t": "f", "p": "generated/vocab/cambridge-18-test-1-reading-1-vocabs.html"}, {"n": "cambridge-21-reading-2-p1-vocabs.html", "t": "f", "p": "generated/vocab/cambridge-21-reading-2-p1-vocabs.html"}, {"n": "cambridge-21-reading-3-vocabs.html", "t": "f", "p": "generated/vocab/cambridge-21-reading-3-vocabs.html"}, {"n": "cambridge-21-test-2-reading-vocabs.html", "t": "f", "p": "generated/vocab/cambridge-21-test-2-reading-vocabs.html"}]}, {"n": "writing", "t": "d", "c": []}]}, {"n": "listening", "t": "d", "c": [{"n": "done", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-18", "t": "d", "c": [{"n": "cambridge-18-test-1-listening.html", "t": "f", "p": "listening/done/cambridge/cambridge-18/cambridge-18-test-1-listening.html"}]}, {"n": "cambridge-21", "t": "d", "c": [{"n": "Cambridge 21 Test 1 Listening @shohrukhposts.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/Cambridge 21 Test 1 Listening @shohrukhposts.html"}, {"n": "Cambridge 21 Test 4 Listening @shohrukhposts.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/Cambridge 21 Test 4 Listening @shohrukhposts.html"}]}]}]}, {"n": "undone", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-21", "t": "d", "c": [{"n": "Cambridge 21 Test 2 Listening @shohrukhposts.html", "t": "f", "p": "listening/undone/cambridge/cambridge-21/Cambridge 21 Test 2 Listening @shohrukhposts.html"}, {"n": "Cambridge 21 Test 3 Listening @shohrukhposts.html", "t": "f", "p": "listening/undone/cambridge/cambridge-21/Cambridge 21 Test 3 Listening @shohrukhposts.html"}]}]}]}]}, {"n": "reading", "t": "d", "c": [{"n": "done", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-18", "t": "d", "c": [{"n": "cambridge-18-test-1-reading.html", "t": "f", "p": "reading/done/cambridge/cambridge-18/cambridge-18-test-1-reading.html"}]}, {"n": "cambridge-21", "t": "d", "c": [{"n": "Cambridge 21 Test 1 Reading @shohrukhposts.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/Cambridge 21 Test 1 Reading @shohrukhposts.html"}, {"n": "Cambridge 21 Test 2 Reading @shohrukhposts.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/Cambridge 21 Test 2 Reading @shohrukhposts.html"}, {"n": "Cambridge 21 Test 3 Reading @shohrukhposts.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/Cambridge 21 Test 3 Reading @shohrukhposts.html"}, {"n": "Cambridge 21 Test 4 Reading @shohrukhposts.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/Cambridge 21 Test 4 Reading @shohrukhposts.html"}]}]}]}, {"n": "undone", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": ".gitkeep", "t": "f", "p": "reading/undone/cambridge/.gitkeep"}]}]}]}, {"n": "templates", "t": "d", "c": [{"n": "vocab.html", "t": "f", "p": "templates/vocab.html"}]}, {"n": "vocab", "t": "d", "c": [{"n": "general-unknown.md", "t": "f", "p": "vocab/general-unknown.md"}, {"n": "known.md", "t": "f", "p": "vocab/known.md"}, {"n": "learning.json", "t": "f", "p": "vocab/learning.json"}]}, {"n": "writing", "t": "d", "c": [{"n": ".gitkeep", "t": "f", "p": "writing/.gitkeep"}]}];
let fileCount=0;
function node(item){
  const li=document.createElement("li");
  if(item.t==="d"){
    li.className="dir";
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<span class="tw">▸</span><span class="ic">📁</span><span class="n">${item.n}</span>`;
    row.onclick=()=>{ li.classList.toggle("open"); row.querySelector(".tw").textContent=li.classList.contains("open")?"▾":"▸"; };
    li.appendChild(row);
    const ul=document.createElement("ul");
    (item.c||[]).forEach(c=>ul.appendChild(node(c)));
    li.appendChild(ul);
  } else {
    fileCount++;
    const a=document.createElement("a");
    a.className="row"; a.href="./"+item.p.split("/").map(encodeURIComponent).join("/");
    a.dataset.path=item.p.toLowerCase();
    a.innerHTML=`<span class="tw"></span><span class="ic">📄</span><span class="n">${item.n}</span>`;
    li.appendChild(a);
  }
  return li;
}
const root=document.createElement("ul");
TREE.forEach(x=>root.appendChild(node(x)));
document.getElementById("tree").appendChild(root);
document.getElementById("count").textContent=fileCount+" files";

const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const t=q.value.trim().toLowerCase();
  document.querySelectorAll("#tree a.row").forEach(a=>{
    a.parentElement.classList.toggle("hide", t && !a.dataset.path.includes(t));
  });
  document.querySelectorAll("#tree li.dir").forEach(d=>{
    const anyVisible=[...d.querySelectorAll("a.row")].some(a=>!a.parentElement.classList.contains("hide"));
    d.classList.toggle("hide", t && !anyVisible);
    if(t && anyVisible){ d.classList.add("open"); const tw=d.querySelector(":scope > .row .tw"); if(tw) tw.textContent="▾"; }
  });
});
</script>
</body>
</html>
