<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>English Vault — Files</title>
<style>
  :root{
    --bg:#f5f8fd;--card:#FFFFFF;--ink:#0f172a;--ink-2:#475569;--ink-3:#8a94a6;
    --line:#e6eaf1;--line-2:#eef2f8;--soft:#eff4fb;
    --blue:#1e6de6;--blue2:#3b82f6;--blued:#0f2f66;--bluebg:#eff6ff;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:22px 20px 90px}
  .hero{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff;border-radius:20px;
    padding:18px 24px 26px;box-shadow:0 14px 36px rgba(30,109,230,.24);margin-bottom:20px}
  .nav{display:flex;gap:6px;margin:0 -4px 12px}
  .nav a{font-size:13px;font-weight:600;color:#dbeafe;text-decoration:none;padding:7px 13px;border-radius:999px;transition:.12s}
  .nav a:hover{background:rgba(255,255,255,.16);color:#fff}
  .nav a.active{background:#fff;color:var(--blue)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe}
  h1{font-weight:800;font-size:29px;margin:8px 0 6px;letter-spacing:-.02em;color:#fff}
  .lede{color:#dbeafe;font-size:14.5px;margin:0}
  .search{width:100%;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-family:var(--sans);outline:none;margin-bottom:16px;background:var(--card);transition:.12s}
  .search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,109,230,.14)}
  #tree,.latest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0}
  .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;color:inherit;font-size:14.5px}
  .row:hover{background:var(--soft)}
  .tw{width:14px;display:inline-block;text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:11px;flex:none}
  .ic{width:18px;flex:none;text-align:center}
  .dir>.row{cursor:pointer;font-weight:600}
  .dir>ul{margin-left:20px;border-left:1px solid var(--line-2);padding-left:6px;display:none}
  .dir.open>ul{display:block}
  a.row .n{color:var(--ink)}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:14px}
  .hide{display:none!important}
  .dir>.row:hover .n{color:var(--blue)}
  .latest{margin-top:16px}
  .latest h2{font-weight:800;font-size:17px;margin:2px 2px 2px;letter-spacing:-.01em}
  .latest .sub{color:var(--ink-3);font-size:12.5px;margin:0 2px 10px}
  .latest a.row{align-items:flex-start}
  .latest .meta{display:flex;flex-direction:column;min-width:0}
  .latest .dirp{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <nav class="nav">
      <a href="./index.html" class="active">Home</a>
      <a href="./player.html">Player</a>
      <a href="./progress.html">Progress</a>
    </nav>
    <div class="eyebrow">📚 English Vault</div>
    <h1>Project files</h1>
    <p class="lede">Browse every folder and file. Click a folder to open it, a file to view it.</p>
  </div>
  <input class="search" id="q" type="text" placeholder="filter files…" autocomplete="off"/>
  <div id="tree"></div>
  <div class="count" id="count"></div>
  <div class="latest" id="latest"></div>
</div>
<script>
const TREE = [{"n": "docs", "t": "d", "c": [{"n": "architecture.md", "t": "f", "p": "docs/architecture.md"}, {"n": "cheatsheet.md", "t": "f", "p": "docs/cheatsheet.md"}]}, {"n": "generated", "t": "d", "c": [{"n": "dictation", "t": "d", "c": [{"n": "dictation.html", "t": "f", "p": "generated/dictation/dictation.html"}]}, {"n": "halqa", "t": "d", "c": [{"n": "learning-questions.json", "t": "f", "p": "generated/halqa/learning-questions.json"}]}, {"n": "translate", "t": "d", "c": [{"n": "translate.html", "t": "f", "p": "generated/translate/translate.html"}]}, {"n": "vocab", "t": "d", "c": [{"n": "done", "t": "d", "c": [{"n": "cambridge-18-test-1-reading-1-vocabs.html", "t": "f", "p": "generated/vocab/done/cambridge-18-test-1-reading-1-vocabs.html"}]}, {"n": "inprogress", "t": "d", "c": [{"n": "C20-r1-vocabs.html", "t": "f", "p": "generated/vocab/inprogress/C20-r1-vocabs.html"}, {"n": "cambridge-21-reading-2-p1-vocabs.html", "t": "f", "p": "generated/vocab/inprogress/cambridge-21-reading-2-p1-vocabs.html"}, {"n": "cambridge-21-reading-3-vocabs.html", "t": "f", "p": "generated/vocab/inprogress/cambridge-21-reading-3-vocabs.html"}, {"n": "cambridge-21-test-2-listening-vocabs.html", "t": "f", "p": "generated/vocab/inprogress/cambridge-21-test-2-listening-vocabs.html"}, {"n": "cambridge-21-test-2-reading-vocabs.html", "t": "f", "p": "generated/vocab/inprogress/cambridge-21-test-2-reading-vocabs.html"}]}, {"n": "review", "t": "d", "c": [{"n": "cambridge-18-test-1-reading-1-review.html", "t": "f", "p": "generated/vocab/review/cambridge-18-test-1-reading-1-review.html"}]}]}, {"n": "writing", "t": "d", "c": []}]}, {"n": "listening", "t": "d", "c": [{"n": "done", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-18", "t": "d", "c": [{"n": "C18-l1.html", "t": "f", "p": "listening/done/cambridge/cambridge-18/C18-l1.html"}]}, {"n": "cambridge-21", "t": "d", "c": [{"n": "C21-l1.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/C21-l1.html"}, {"n": "C21-l2.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/C21-l2.html"}, {"n": "C21-l3.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/C21-l3.html"}, {"n": "C21-l4.html", "t": "f", "p": "listening/done/cambridge/cambridge-21/C21-l4.html"}]}]}]}, {"n": "undone", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-20", "t": "d", "c": [{"n": "C20-l1.html", "t": "f", "p": "listening/undone/cambridge/cambridge-20/C20-l1.html"}, {"n": "C20-l2.html", "t": "f", "p": "listening/undone/cambridge/cambridge-20/C20-l2.html"}, {"n": "C20-l3.html", "t": "f", "p": "listening/undone/cambridge/cambridge-20/C20-l3.html"}, {"n": "C20-l4.html", "t": "f", "p": "listening/undone/cambridge/cambridge-20/C20-l4.html"}]}]}]}]}, {"n": "reading", "t": "d", "c": [{"n": "done", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-18", "t": "d", "c": [{"n": "C18-r1.html", "t": "f", "p": "reading/done/cambridge/cambridge-18/C18-r1.html"}]}, {"n": "cambridge-21", "t": "d", "c": [{"n": "C21-r1.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/C21-r1.html"}, {"n": "C21-r2.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/C21-r2.html"}, {"n": "C21-r3.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/C21-r3.html"}, {"n": "C21-r4.html", "t": "f", "p": "reading/done/cambridge/cambridge-21/C21-r4.html"}]}]}]}, {"n": "undone", "t": "d", "c": [{"n": "cambridge", "t": "d", "c": [{"n": "cambridge-20", "t": "d", "c": [{"n": "C20-r1.html", "t": "f", "p": "reading/undone/cambridge/cambridge-20/C20-r1.html"}, {"n": "C20-r2.html", "t": "f", "p": "reading/undone/cambridge/cambridge-20/C20-r2.html"}, {"n": "C20-r3.html", "t": "f", "p": "reading/undone/cambridge/cambridge-20/C20-r3.html"}, {"n": "C20-r4.html", "t": "f", "p": "reading/undone/cambridge/cambridge-20/C20-r4.html"}]}]}]}]}, {"n": "vocab", "t": "d", "c": [{"n": "for-dictation.md", "t": "f", "p": "vocab/for-dictation.md"}, {"n": "general-unknown.md", "t": "f", "p": "vocab/general-unknown.md"}, {"n": "known.md", "t": "f", "p": "vocab/known.md"}, {"n": "learning.json", "t": "f", "p": "vocab/learning.json"}, {"n": "need-to-review.json", "t": "f", "p": "vocab/need-to-review.json"}, {"n": "translations.json", "t": "f", "p": "vocab/translations.json"}]}, {"n": "writing", "t": "d", "c": []}];
const LATEST = [{"n": "cambridge-18-test-1-reading-1-review.html", "p": "generated/vocab/review/cambridge-18-test-1-reading-1-review.html", "d": "generated/vocab/review"}, {"n": "cheatsheet.md", "p": "docs/cheatsheet.md", "d": "docs"}, {"n": "need-to-review.json", "p": "vocab/need-to-review.json", "d": "vocab"}, {"n": "for-dictation.md", "p": "vocab/for-dictation.md", "d": "vocab"}, {"n": "translate.html", "p": "generated/translate/translate.html", "d": "generated/translate"}];
let fileCount=0;
function node(item){
  const li=document.createElement("li");
  if(item.t==="d"){
    li.className="dir";
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<span class="tw">▸</span><span class="ic">📁</span><span class="n">${item.n}</span>`;
    row.onclick=()=>{ li.classList.toggle("open"); row.querySelector(".tw").textContent=li.classList.contains("open")?"▾":"▸"; };
    li.appendChild(row);
    const ul=document.createElement("ul");
    (item.c||[]).forEach(c=>ul.appendChild(node(c)));
    li.appendChild(ul);
  } else {
    fileCount++;
    const a=document.createElement("a");
    a.className="row"; a.href="./"+item.p.split("/").map(encodeURIComponent).join("/");
    a.dataset.path=item.p.toLowerCase();
    a.innerHTML=`<span class="tw"></span><span class="ic">📄</span><span class="n">${item.n}</span>`;
    li.appendChild(a);
  }
  return li;
}
const root=document.createElement("ul");
TREE.forEach(x=>root.appendChild(node(x)));
document.getElementById("tree").appendChild(root);
document.getElementById("count").textContent=fileCount+" files";

if(LATEST.length){
  const box=document.getElementById("latest");
  box.innerHTML=`<h2>Latest added</h2><p class="sub">The ${LATEST.length} most recently added files.</p>`;
  const ul=document.createElement("ul");
  LATEST.forEach(f=>{
    const li=document.createElement("li");
    const a=document.createElement("a");
    a.className="row"; a.href="./"+f.p.split("/").map(encodeURIComponent).join("/");
    a.innerHTML=`<span class="ic">📄</span><span class="meta"><span class="n">${f.n}</span><span class="dirp">${f.d}</span></span>`;
    li.appendChild(a); ul.appendChild(li);
  });
  box.appendChild(ul);
}

const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const t=q.value.trim().toLowerCase();
  document.querySelectorAll("#tree a.row").forEach(a=>{
    a.parentElement.classList.toggle("hide", t && !a.dataset.path.includes(t));
  });
  document.querySelectorAll("#tree li.dir").forEach(d=>{
    const anyVisible=[...d.querySelectorAll("a.row")].some(a=>!a.parentElement.classList.contains("hide"));
    d.classList.toggle("hide", t && !anyVisible);
    if(t && anyVisible){ d.classList.add("open"); const tw=d.querySelector(":scope > .row .tw"); if(tw) tw.textContent="▾"; }
  });
});
</script>
</body>
</html>
