ike a really simple solution.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, absolutely. I’m not sure there’s much you can do about children with dyspraxia writing very slowly. It’s more important to focus on accuracy, and as they get more confident, I think they eventually speed up.<\/p><p class=\"ln\"><b>WOMAN<\/b> One quite simple thing you can do is to use grid paper. So they write each letter in a box and that trains them to space the letters correctly.<\/p><p class=\"ln\"><b>MAN<\/b> Indeed, that’s more important for legibility than trying to get them to write in a straight line.<\/p><p class=\"sys\">Before you hear the rest of the discussion, you have some time to look at questions 25 to 30. Now listen and answer questions 25 to 30.<\/p><p class=\"ln\"><b>MAN<\/b> For some children, it might be better to teach them to write on a laptop rather than by hand, like children with dyslexia. They often really struggle with handwriting and some just give up.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, it’s not as frustrating for them if they get things wrong. On a keyboard, they can be more willing to have a go. But I read that developing fluency isn’t any faster.<\/p><p class=\"ln\"><b>MAN<\/b> That’s right. Did you read that article on the benefits of teaching print rather than cursive handwriting, where the letters are joined up?<\/p><p class=\"ln\"><b>WOMAN<\/b> Yes. Well, in the past, cursive writing was certainly considered more stylish and educated, but not anymore. Teachers’ attitudes have changed because it’s been proved that cursive is more difficult to learn, especially for children with learning difficulties who find joining up letters really challenging.<\/p><p class=\"ln\"><b>MAN<\/b> I agree. I was always worried that my poor handwriting affected my exam results, and now research shows that I was right to worry. I’m sure a lot of students think it’s unfair that they’re being judged on their handwriting, not just their knowledge.<\/p><p class=\"ln\"><b>WOMAN<\/b> Marks are definitely affected if examiners can’t read the script. That is why it has always been so important to teach children to write legibly. Do you think the role of handwriting will change in the future?<\/p><p class=\"ln\"><b>MAN<\/b> I can’t see that changing much. Touch typing still isn’t taught in most schools, which is a shame. But maybe that won’t be necessary in the future, because people will also be able to write by hand on digital devices. Anyway, teachers understand the value of handwriting. It’s a basic life skill.<\/p><p class=\"ln\"><b>WOMAN<\/b> True. However, the fact is that people are writing by hand less and less and relying on digital devices. That does cause some problems.<\/p><p class=\"ln\"><b>MAN<\/b> You mean like note-taking. There are lots of apps for that.<\/p><p class=\"ln\"><b>WOMAN<\/b> And for reading historical documents, apparently. But my mum is shocked by my awful spelling and the fact that my punctuation is really inconsistent. I think you can put that down to lack of practice.<\/p><p class=\"ln\"><b>MAN<\/b> I expect so. Personally, I miss writing by hand. I hardly ever write anything now. I remember my grandparents had such beautiful handwriting and it was so individual. Nobody I know would be able to identify my handwriting now. It’s a shame.<\/p><p class=\"ln\"><b>WOMAN<\/b> I know. I feel the same way. I used to write a diary by hand and now I do that digitally. It just seems less effort to do it that way. So it’s not just a problem…<\/p>", "trtype": "full"}, {"id": "t16", "key": "Cambridge 20|Test 4 · Part 4", "group": "Cambridge 20", "label": "Test 4 · Part 4", "media": "Cambridge 20 — Test 4, Part 4", "offline": false, "tr": "<p class=\"ln\"><b>LECTURER<\/b> We’ve been looking at different types of conflicts that may arise between wildlife and humans at the boundaries of protected areas, such as national parks and animal sanctuaries. I’d like to illustrate this by telling you about some research that I’ve been involved in recently in the Central African country of Zambia, in the area around the Chembe Bird Sanctuary, which contains over 300 of the listed birds of Zambia. These include a number of birds of prey, such as eagles, hawks and owls, that live by hunting and killing other birds and animals.<\/p><p class=\"ln\"><b>LECTURER<\/b> Now, most of the people living in the local communities near to the bird sanctuary are small-scale farmers, and these birds of prey provide important social and ecological benefits to them. For example, a lot of damage can be caused to farmers’ crops by rodents, such as rats, which would consume the crops as they grow in the fields, as well as after harvesting, if they weren’t hunted and killed by the birds. And the predatory habits of these birds also protect farmers in other ways. For example, a major danger to rural workers is snakes, whose bite may be dangerous or even fatal, and birds of prey have a major role in keeping their populations under control.<\/p><p class=\"ln\"><b>LECTURER<\/b> Local people have always been aware of these benefits, and for years, even before the sanctuary was opened in 1973, the birds played a key role in the culture of the region. However, more recently, the sanctuary and its birds have also become increasingly important to the community in economic terms, because at present, after a relatively slow start, tourism has become an important source of revenue for them.<\/p><p class=\"ln\"><b>LECTURER<\/b> However, although these birds of prey are protected by the government, their numbers are falling. Some of these deaths are accidental. Fatalities occur when birds alight on roads to catch and eat their prey and are hit by fast moving traffic. Drivers in Zambia have to take special care at night, as birds may regard the quieter roads as safe places to sleep. Accidental deaths may also occur if these birds fly close to high power lines, as they may be electrocuted. This is a particular danger in the heavy rain which can occur in the region in the months from December to April. And local farmers also pose a threat to these birds. As well as growing crops, small-scale farmers in the area also rear chickens.<\/p><p class=\"ln\"><b>LECTURER<\/b> These provide food for the farmers’ families, as well as being an important source of income. But they’re also an easy target for birds of prey, and so farmers may shoot these birds, which is illegal but understandable, or they may poison the birds, which again is illegal and can have negative effects on the ecosystem. So how else can farmers protect their chickens from birds of prey? Some people believe that to prevent the predators from settling near the area where the chickens are kept, it’s best to keep this area free from vegetation. But in fact, this is counterproductive, as it means the chickens have no cover to hide in and they’ll be easier for the birds to see. Another possibility would be to prevent the chickens from going outside at all and to keep them safe from predators inside a building, but this would cost far too much to be a practical solution.<\/p><p class=\"ln\"><b>LECTURER<\/b> Nearly all the farmers reported that they spent a lot of time and effort trying to frighten off the birds of prey without actually harming them. Most of the farmers had at least one dog and said this was a big help at scaring away the predators. Some of the farmers also reported that during the breeding season, when the chickens were particularly vulnerable, they encouraged their children to watch over the chickens and to hit pans with a metal spoon so that the resulting noise would succeed in driving away birds that were trying to seize the young chicks. None of these methods was 100% effective, so as a result the village people told us that rather than just using one method, they were forced to use a combination for them to have any effect. And even so, these birds of prey remain a major threat to the chickens’ survival and cause considerable economic loss to farmers. So we looked at the possibility of a longer-term solution to…<\/p>", "trtype": "full"}, {"id": "t17", "key": "Cambridge 21|Test 1", "group": "Cambridge 21", "label": "Test 1", "media": "Cambridge 21 — Test 1", "offline": false, "tr": "<p class=\"ln\"><b>Q1 · WOMAN<\/b> ...usually about eight people but no more than <mark>ten<\/mark> – and everyone&rsquo;s always very friendly.<\/p><p class=\"ln\"><b>Q2 · WOMAN<\/b> ...you learn about things like the <mark>weather<\/mark>, which is obviously really important...<\/p><p class=\"ln\"><b>Q3 · WOMAN<\/b> ...make sure you understand everything you need to know about <mark>safety<\/mark>.<\/p><p class=\"ln\"><b>Q4 · WOMAN<\/b> &pound;200. But it&rsquo;s a bit cheaper if you decide to join the club. There&rsquo;s a <mark>discount<\/mark> for members.<\/p><p class=\"ln\"><b>Q5 · WOMAN<\/b> ...you also get a really good <mark>dictionary<\/mark> explaining all the sailing terminology.<\/p><p class=\"ln\"><b>Q6 · WOMAN<\/b> ...on completion of the course you get a <mark>certificate<\/mark>.<\/p><p class=\"ln\"><b>Q7 · MAN<\/b> And a <mark>towel<\/mark>?<\/p><p class=\"ln\"><b>Q8 · MAN<\/b> ...is there a <mark>caf&eacute;<\/mark> at the club?<\/p><p class=\"ln\"><b>Q9 · WOMAN<\/b> I recommend you watch some <mark>videos<\/mark> we use for training.<\/p><p class=\"ln\"><b>Q10 · MAN<\/b> ...I&rsquo;m just wondering if there are <mark>lockers<\/mark> for people to use?<\/p><p class=\"ln\"><b>Q11 · MAN<\/b> Make sure your transport costs are covered.<\/p><p class=\"ln\"><b>Q12 · MAN<\/b> ...you&rsquo;re likely to get the opportunity to work with a range of age groups, as well as different <mark>ethnicities<\/mark>.<\/p><p class=\"ln\"><b>Q13 · MAN<\/b> ...even when they&rsquo;re having to work with directors who are impatient, or unhappy...<\/p><p class=\"ln\"><b>Q14 · MAN<\/b> At first, I found it overwhelming and could hardly speak, I was so in awe.<\/p><p class=\"ln\"><b>Q15 · MAN<\/b> Every makeup trainee will need a makeup kit, which they&rsquo;ll be expected to have with them at all times.<\/p><p class=\"ln\"><b>Q16 · MAN<\/b> But remember you&rsquo;ll need to get <mark>approval<\/mark>...<\/p><p class=\"ln\"><b>Q17 · WOMAN<\/b> ...get this done without wasting any <mark>time<\/mark>.<\/p><p class=\"ln\"><b>Q18 · WOMAN<\/b> This information needs to be kept in good <mark>order<\/mark>.<\/p><p class=\"ln\"><b>Q19 · WOMAN<\/b> Having a positive attitude and being willing to do whatever is asked of you...<\/p><p class=\"ln\"><b>Q20 · WOMAN<\/b> ...you&rsquo;ll need to keep up a <mark>swift<\/mark> pace and not spend too long on each person.<\/p><p class=\"ln\"><b>Q21 · PHIL<\/b> The examples she gave were at a more <mark>global<\/mark> level, and they really made it clear to me...<\/p><p class=\"ln\"><b>Q22 · LUCY<\/b> ...I especially liked the way her lecture focused on more <mark>long-term<\/mark> issues.<\/p><p class=\"ln\"><b>Q23 · PHIL<\/b> ...the description of improvements in systems used for tracking marine animals and things like <mark>robots<\/mark> were really interesting.<\/p><p class=\"ln\"><b>Q24 · PHIL<\/b> ...quite unusual to have so many <mark>experts<\/mark> working together.<\/p><p class=\"ln\"><b>Q25 · PHIL<\/b> ...he didn&rsquo;t really provide much <mark>information<\/mark> to explain why.<\/p><p class=\"ln\"><b>Q26 · LUCY<\/b> ...it was showing its <mark>age<\/mark>.<\/p><p class=\"ln\"><b>Q27 · PHIL<\/b> ...everybody <mark>knows<\/mark> that anyway.<\/p><p class=\"ln\"><b>Q28 · PHIL<\/b> ...I thought it was a well-written <mark>summary<\/mark> of those.<\/p><p class=\"ln\"><b>Q29 · LUCY<\/b> The article on metal toxicity was way above my <mark>head<\/mark>...<\/p><p class=\"ln\"><b>Q30 · LUCY<\/b> ...though it presented a rather <mark>one-sided<\/mark> picture...<\/p><p class=\"ln\"><b>Q31<\/b> Three resources which are essential for industrial civilisation: <mark>metal<\/mark>, fossil fuels and rubber.<\/p><p class=\"ln\"><b>Q32<\/b> The supply is limited because the growth of the tree is <mark>slow<\/mark>...<\/p><p class=\"ln\"><b>Q33<\/b> ...production cannot easily be adjusted because of increasing or decreasing <mark>demand<\/mark>.<\/p><p class=\"ln\"><b>Q34<\/b> ...the tree only grows near the <mark>equator<\/mark>.<\/p><p class=\"ln\"><b>Q35<\/b> ...it is very difficult to <mark>recycle<\/mark> rubber after production.<\/p><p class=\"ln\"><b>Q36<\/b> ...lack of genetic diversity, leading to danger of disease caused by a <mark>fungus<\/mark>.<\/p><p class=\"ln\"><b>Q37<\/b> ...extreme <mark>weather<\/mark> events.<\/p><p class=\"ln\"><b>Q38<\/b> Synthetic rubber is less <mark>strong<\/mark> than natural rubber.<\/p><p class=\"ln\"><b>Q39<\/b> A wild flower (a type of dandelion) has rubber in its <mark>roots<\/mark>.<\/p><p class=\"ln\"><b>Q40<\/b> ...does not require good <mark>soil<\/mark>.<\/p>", "trtype": "snippets"}, {"id": "t18", "key": "Cambridge 21|Test 2", "group": "Cambridge 21", "label": "Test 2", "media": "Cambridge 21 — Test 2", "offline": false, "tr": "<p class=\"ln\"><b>Q1<\/b> I remember there was one on how to make Vietnamese food that sounded good. I think that was on the <mark>13th of January<\/mark>.<\/p><p class=\"ln\"><b>Q2<\/b> The actual cost is <mark>&pound;48<\/mark> but then there&rsquo;s an extra charge as well as that for the ingredients. I&rsquo;m not sure how much that is, no more than twenty pounds I think.<\/p><p class=\"ln\"><b>Q3<\/b> I think they make white bread and then they make sourdough, that seems to be very fashionable at present. And they learn how to make <mark>pizza<\/mark>, which is apparently really good.<\/p><p class=\"ln\"><b>Q4<\/b> The teacher trained in <mark>India<\/mark>. The massage is meant to relax you and get rid of lines and wrinkles.<\/p><p class=\"ln\"><b>Q5<\/b> The massage is meant to relax you and get rid of lines and wrinkles. You practise it on yourself so you have to take a <mark>mirror<\/mark> to the class, so you can see what you&rsquo;re doing.<\/p><p class=\"ln\"><b>Q6<\/b> Let me check &hellip; yes, it&rsquo;s on the <mark>6th<\/mark>. It was on the 23rd of January but they had to change the date.<\/p><p class=\"ln\"><b>Q7<\/b> Only <mark>natural<\/mark> ingredients are used. The candles can be used as presents.<\/p><p class=\"ln\"><b>Q8<\/b> It&rsquo;s <mark>&pound;67.50<\/mark>, which is really good value I think. There&rsquo;s a similar class I&rsquo;ve seen that was &pound;110.<\/p><p class=\"ln\"><b>Q9<\/b> Everyone has to bring something to protect their clothing, like an apron if you&rsquo;ve got one, or a <mark>shirt<\/mark> that you don&rsquo;t use any more. The dye can really stain your clothes.<\/p><p class=\"ln\"><b>Q10<\/b> I even need to learn how to use a <mark>hammer<\/mark> because I always end up hitting my fingers.<\/p><p class=\"ln\"><b>Q11<\/b> The castle&rsquo;s now just a pile of stones but it&rsquo;s a great place to take photos. Don&rsquo;t miss the ruins of a certain building.<\/p><p class=\"ln\"><b>Q12<\/b> As there are clear signposts all along the way, you don&rsquo;t even need to take a map with you. Don&rsquo;t worry about getting lost.<\/p><p class=\"ln\"><b>Q13<\/b> This is a circular walk that brings you back down to the starting point. The car park at Melby Coal Mine is where you begin.<\/p><p class=\"ln\"><b>Q14<\/b> A tower stands on the site of an older structure. The tower that&rsquo;s situated where there was once a seventeenth-century hunting lodge.<\/p><p class=\"ln\"><b>Q15<\/b> Go through the ticket office to an area where there are lockers to leave heavy bags in, and where you can borrow raincoats. Beyond that room is the <mark>exhibition<\/mark>.<\/p><p class=\"ln\"><b>Q16<\/b> You can see that in the building directly to the north of the engine house. It&rsquo;s a small bathhouse where miners washed.<\/p><p class=\"ln\"><b>Q17<\/b> You can find that in a small L-shaped building in the middle of the northern boundary of the site. It&rsquo;s a display of early mining tools.<\/p><p class=\"ln\"><b>Q18<\/b> It&rsquo;s in the southwest corner of the site, and can be accessed via a covered walkway. The vehicle shed contains wagons and cutting machines.<\/p><p class=\"ln\"><b>Q19<\/b> It&rsquo;s on the north-eastern boundary of the site. There&rsquo;s a field with ponies.<\/p><p class=\"ln\"><b>Q20<\/b> The centre is connected to the ticket office via a short section of covered walkway. The education centre contains a library and gift shop.<\/p><p class=\"ln\"><b>Q21<\/b> But I hadn&rsquo;t realised that unsafe food causes more than 200 different <mark>diseases<\/mark>. No, I&rsquo;d no idea it was that many.<\/p><p class=\"ln\"><b>Q22<\/b> When animals are treated with <mark>antibiotics<\/mark> then consumed by humans, the antibiotics get into the food chain. I had no idea about that either.<\/p><p class=\"ln\"><b>Q23<\/b> What the researchers succeeded in doing was to ensure that these <mark>tests<\/mark> were carried out at different stages in the food&rsquo;s journey.<\/p><p class=\"ln\"><b>Q24<\/b> I thought it was really good to address a problem that&rsquo;s faced by so many different groups. People with special religious rules, as well as vegetarians and vegans.<\/p><p class=\"ln\"><b>Q25<\/b> The seafood industry, where stocks are in danger of being overexploited as a food source unless we can find ways of keeping stocks up. Yes, that&rsquo;d be a good topic.<\/p><p class=\"ln\"><b>Q26<\/b> What about sessions on the variety of food and eating habits around the world? That&rsquo;s very relevant nowadays.<\/p><p class=\"ln\"><b>Q27<\/b> We made up our minds about that pretty quickly. I know some students found it a lot harder to choose, and wasted a lot of time.<\/p><p class=\"ln\"><b>Q28<\/b> Then we had to do the literature review. We hadn&rsquo;t done one of these before so the handout with advice for the project was very useful here.<\/p><p class=\"ln\"><b>Q29<\/b> Then product development, actually deciding what we&rsquo;d use to make the falafel. For me the interesting thing was that we wanted it to be something a bit different from an ordinary falafel.<\/p><p class=\"ln\"><b>Q30<\/b> We just moved on and kept adapting it and in the end it turned out fine and we had a lot of fun. We did!<\/p><p class=\"ln\"><b>Q31<\/b> <mark>Pollution<\/mark>, for example, is among the greatest threats to many popular tourist destinations. Overtourism occurs in places where excessive numbers of tourists cause significant problems.<\/p><p class=\"ln\"><b>Q32<\/b> Several cities, such as Barcelona, have responded by imposing a <mark>tax<\/mark> which all visitors from cruise ships have to pay. But as it&rsquo;s only a couple of euros, many green campaigners think it won&rsquo;t deter enough people.<\/p><p class=\"ln\"><b>Q33<\/b> The city was becoming like a &ldquo;theme park&rdquo;, with shops only catering for tourists, selling <mark>chocolate<\/mark>, which Belgium is famous for, and other souvenirs. The local council took action to limit cruise passengers.<\/p><p class=\"ln\"><b>Q34<\/b> What it does now is control the <mark>timing<\/mark> of all cruise ship entries to the city&rsquo;s port. However, many people feel this measure does not go far enough.<\/p><p class=\"ln\"><b>Q35<\/b> A recent survey showed that <mark>cost<\/mark> is also a major factor in putting younger groups off going on a cruise. But what they don&rsquo;t realise is that cruises can actually be good value.<\/p><p class=\"ln\"><b>Q36<\/b> Another perception is that cruises have lots of <mark>rules<\/mark> about what to wear and how to behave. But these days, most cruises are no longer very formal and behind the times.<\/p><p class=\"ln\"><b>Q37<\/b> There&rsquo;s even a boxing ring on one ship, and most offer <mark>diving<\/mark> expeditions. But there&rsquo;s also a huge focus on well-being with a variety of sessions.<\/p><p class=\"ln\"><b>Q38<\/b> Cruise ships have had to radically update their menus to suit the tastes of their younger customers. <mark>Vegan<\/mark> dishes are standard, for example.<\/p><p class=\"ln\"><b>Q39<\/b> Many people going on longer cruises also spend time working, so companies have to guarantee <mark>wifi<\/mark> that can be relied upon at all times.<\/p><p class=\"ln\"><b>Q40<\/b> Leading cruise lines now employ top agencies to produce first-rate <mark>videos<\/mark> for social media channels. It will be interesting to see whether this helps attract younger passengers.<\/p>", "trtype": "snippets"}, {"id": "t19", "key": "Cambridge 21|Test 3", "group": "Cambridge 21", "label": "Test 3", "media": "Cambridge 21 — Test 3", "offline": false, "tr": "<p class=\"ln\"><b>Q1<\/b> There&rsquo;s only one &ndash; it&rsquo;s called <mark>Northern<\/mark> Ferries. The ferries all leave from Aberdeen.<\/p><p class=\"ln\"><b>Q2<\/b> There&rsquo;s only one ferry leaving every evening in summer anyway, seven days a <mark>week<\/mark>. I&rsquo;m not sure about the winter months.<\/p><p class=\"ln\"><b>Q3<\/b> Four people and a car worked out at just under <mark>&pound;250<\/mark>. I was expecting it to be more like &pound;400 during the peak season.<\/p><p class=\"ln\"><b>Q4<\/b> I don&rsquo;t think it&rsquo;s their policy to give refunds &ndash; just a <mark>voucher<\/mark> which you can use at a later date. But you have to cancel a month in advance to get that.<\/p><p class=\"ln\"><b>Q5<\/b> We booked too late to get a cabin with a <mark>window<\/mark>. They&rsquo;re more expensive but much nicer than the inner cabins.<\/p><p class=\"ln\"><b>Q6<\/b> The selection on board is quite limited and not that healthy either. So it&rsquo;s best to bring some <mark>books<\/mark> for them.<\/p><p class=\"ln\"><b>Q7<\/b> The kennels on board are OK &ndash; they&rsquo;re quite big &ndash; you just need to provide a <mark>blanket<\/mark>.<\/p><p class=\"ln\"><b>Q8<\/b> They loved being on the sea at night and in the morning keeping a lookout for <mark>dolphins<\/mark> &ndash; we saw loads.<\/p><p class=\"ln\"><b>Q9<\/b> We decided to go somewhere else rather than hang around at the port for so long. <mark>Drum<\/mark> Castle.<\/p><p class=\"ln\"><b>Q10<\/b> We looked up restaurants in the area and found an <mark>Italian<\/mark> one in a village nearby. I can check the name of it for you if you&rsquo;re interested.<\/p><p class=\"ln\"><b>Q11<\/b> People like the idea of trying something they can&rsquo;t get anywhere else. They also like seeing food prepared in front of them.<\/p><p class=\"ln\"><b>Q12<\/b> They also like seeing food prepared in front of them and which hasn&rsquo;t come straight out of a freezer. What you get with street food is something different.<\/p><p class=\"ln\"><b>Q13<\/b> <mark>Food markets<\/mark>, on the other hand, are great because customers are always really interested in food and give great feedback.<\/p><p class=\"ln\"><b>Q14<\/b> And if you can get a spot in your local <mark>park<\/mark> &ndash; fantastic. Usually very relaxed but with lots of customers passing by.<\/p><p class=\"ln\"><b>Q15<\/b> I&rsquo;d try to get things like hobs and fridges <mark>second hand<\/mark> if you can. You can replace them with better quality stuff if your business takes off.<\/p><p class=\"ln\"><b>Q16<\/b> It&rsquo;s got to be easy to eat and look attractive or customers won&rsquo;t come back. Will it all be easily recyclable or reusable?<\/p><p class=\"ln\"><b>Q17<\/b> Their work-life balance was non-existent as they were working til midnight in the restaurant all week. Then took their food truck to markets on their days off.<\/p><p class=\"ln\"><b>Q18<\/b> The owners of Basque found it was hard to make a profit because the price of <mark>fish<\/mark> was so high. And it was hard to charge customers a lot more for those dishes.<\/p><p class=\"ln\"><b>Q19<\/b> Some of their dishes were quite complicated. At one of their first events they ended up with people standing in a long queue for more than 15 minutes.<\/p><p class=\"ln\"><b>Q20<\/b> What they hadn&rsquo;t realised was that they&rsquo;d need a special <mark>licence<\/mark>. It was a complicated process and in the end they gave up.<\/p><p class=\"ln\"><b>Q21<\/b> Most people use these terms interchangeably &ndash; but in fact the difference is quite distinct when you think about it.<\/p><p class=\"ln\"><b>Q22<\/b> They&rsquo;re often deliberately vague, I think, and don&rsquo;t provide enough information about how their products are made.<\/p><p class=\"ln\"><b>Q23<\/b> I wasn&rsquo;t convinced by the argument that wool production is sustainable because it doesn&rsquo;t use many chemicals. What about all the fungicides and insecticides used in sheep farming?<\/p><p class=\"ln\"><b>Q24<\/b> I couldn&rsquo;t find any evidence for the claim about sheep farming being better for the environment than cattle farming. No &ndash; they&rsquo;re both really bad.<\/p><p class=\"ln\"><b>Q25<\/b> Over 99% of dissolving agents used in the manufacturing process are used again. That&rsquo;s true of Lyocell.<\/p><p class=\"ln\"><b>Q26<\/b> It doesn&rsquo;t compare favourably with all the other sustainable fabrics we&rsquo;ve looked at, no. That applies to Cupro.<\/p><p class=\"ln\"><b>Q27<\/b> The manufacturing process for a significant proportion of bamboo is chemically quite intensive. Which obviously can be quite damaging.<\/p><p class=\"ln\"><b>Q28<\/b> Manufacturing causes 50 percent fewer emissions and takes up half as much energy as conventional fabrics. That&rsquo;s EcoVero.<\/p><p class=\"ln\"><b>Q29<\/b> It&rsquo;s the only fabric that&rsquo;s fundamentally sustainable &ndash; the cork trees it comes from are renewable and the product itself is both recyclable and biodegradable.<\/p><p class=\"ln\"><b>Q30<\/b> Did you know that clothes made from hemp protect the wearer from the sun and it&rsquo;s also antibacterial? Hemp is another really good sustainable fabric.<\/p><p class=\"ln\"><b>Q31<\/b> Invasive species may eat native species, or sometimes they may bring a <mark>disease<\/mark> with them. Native species have never faced it before and have no defences against it.<\/p><p class=\"ln\"><b>Q32<\/b> They can also take food from native species, or in some cases threaten an entire <mark>ecosystem<\/mark>.<\/p><p class=\"ln\"><b>Q33<\/b> This could be accidental, such as when people who&rsquo;ve been on <mark>holiday<\/mark> in another country come back with the seeds of plants on their clothes or shoes.<\/p><p class=\"ln\"><b>Q34<\/b> Humans deliberately move animals and plants around the world, for example to use them to control pests on farms, or to be <mark>pets<\/mark>.<\/p><p class=\"ln\"><b>Q35<\/b> It was hoped that the toads would eat the grey-backed beetles responsible for destroying crops of <mark>sugar<\/mark> on many of the plantations.<\/p><p class=\"ln\"><b>Q36<\/b> They&rsquo;re now seen as harmful because they block out so much <mark>light<\/mark> that native wild flowers can&rsquo;t grow beneath them.<\/p><p class=\"ln\"><b>Q37<\/b> The grey squirrels carry a type of <mark>virus<\/mark> that is deadly to the red squirrels. Red squirrel populations have collapsed.<\/p><p class=\"ln\"><b>Q38<\/b> The first step in controlling invasive species is learning about the <mark>behaviour<\/mark> of new species coming into the country. Monitoring is an important part of this.<\/p><p class=\"ln\"><b>Q39<\/b> One effective way to keep track of invasive species is to create a <mark>database<\/mark> for the whole country. That way, all relevant authorities can share important information.<\/p><p class=\"ln\"><b>Q40<\/b> They should be encouraged to <mark>photograph<\/mark> harmful species &ndash; because this helps with identification &ndash; and then to report when and where these were observed.<\/p>", "trtype": "snippets"}, {"id": "t20", "key": "Cambridge 21|Test 4", "group": "Cambridge 21", "label": "Test 4", "media": "Cambridge 21 — Test 4", "offline": false, "tr": "<p class=\"ln\"><b>Q1<\/b> Martyn <mark>Leigh<\/mark>. Martyn&rsquo;s with a Y. It&rsquo;s L-E-I-G-H.<\/p><p class=\"ln\"><b>Q2<\/b> Normally I catch the bus, but I&rsquo;m on my <mark>motorbike<\/mark> today. It&rsquo;s quicker for getting into town.<\/p><p class=\"ln\"><b>Q3<\/b> I&rsquo;ve just been to the <mark>hairdresser<\/mark>. I wanted to look smart for my interview tomorrow.<\/p><p class=\"ln\"><b>Q4<\/b> Now I&rsquo;m on my way to buy a <mark>suit<\/mark> that I can wear to the interview. I hope I find something suitable.<\/p><p class=\"ln\"><b>Q5<\/b> I&rsquo;ve got to go and pick up my <mark>laptop<\/mark>. It&rsquo;s been repaired and the shop said it was ready today.<\/p><p class=\"ln\"><b>Q6<\/b> If I&rsquo;m free on a <mark>Monday<\/mark>, that&rsquo;s when I choose to come into town. The shops are quieter then.<\/p><p class=\"ln\"><b>Q7<\/b> There are a lot of new <mark>coffee<\/mark> shops now. Are you enjoying them?<\/p><p class=\"ln\"><b>Q8<\/b> There&rsquo;s only one place that sells <mark>books<\/mark> at the moment. It&rsquo;d be nice to have a choice.<\/p><p class=\"ln\"><b>Q9<\/b> My favourite thing is the <mark>plants<\/mark> they&rsquo;ve put around the building. They make it feel much more welcoming.<\/p><p class=\"ln\"><b>Q10<\/b> Like the new <mark>cinema<\/mark>? I think that&rsquo;s unnecessary &mdash; we already have enough entertainment.<\/p><p class=\"ln\"><b>Q11<\/b> We also used the <mark>Breakout area<\/mark> where people could sit down and relax, and try out our products. Due to popular request we used that again last year.<\/p><p class=\"ln\"><b>Q12<\/b> Last year we also sponsored the innovative <mark>Business Connections Zone<\/mark> where people could leave their contact details on a board. That also effectively raised our corporate profile.<\/p><p class=\"ln\"><b>Q13<\/b> The scheme is available to <mark>every member of your organisation<\/mark>. That includes everyone working for exhibiting companies.<\/p><p class=\"ln\"><b>Q14<\/b> Discounts including major high street fashion and jewellery outlets, as well as <mark>grocery chains<\/mark>. They can be used for both food and clothing.<\/p><p class=\"ln\"><b>Q15<\/b> In a remarkably short time he had opened an amazing <mark>76 restaurants worldwide<\/mark>. He&rsquo;ll be telling you how it all happened.<\/p><p class=\"ln\"><b>Q16<\/b> He also makes regular <mark>donations to organisations helping those in need<\/mark> both in the UK and elsewhere in the world.<\/p><p class=\"ln\"><b>Q17<\/b> He&rsquo;ll be telling you about what he discovered during his <mark>travels around the world about business practices in different cultures<\/mark>.<\/p><p class=\"ln\"><b>Q18<\/b> She&rsquo;s also passionate about <mark>helping people gain employment<\/mark>.<\/p><p class=\"ln\"><b>Q19<\/b> He&rsquo;ll be talking about the need for <mark>flexibility to cope with new directions<\/mark>.<\/p><p class=\"ln\"><b>Q20<\/b> An <mark>interactive look at different obstacles in people&rsquo;s own lives<\/mark>.<\/p><p class=\"ln\"><b>Q21<\/b> We mustn&rsquo;t be too general, we&rsquo;ve got to <mark>support our points by referring to specific cases<\/mark>. So that&rsquo;ll need a lot of work.<\/p><p class=\"ln\"><b>Q22<\/b> I think your suggestion about <mark>intergenerational living<\/mark> might be more interesting &ndash; let&rsquo;s go with that.<\/p><p class=\"ln\"><b>Q23<\/b> I think the solution is to design <mark>multi-storey apartment blocks<\/mark>. Building up rather than out, yes.<\/p><p class=\"ln\"><b>Q24<\/b> It would greatly improve how you feel if you live in an <mark>urban high-rise<\/mark>. You can do it on a one-storey building in a suburb too.<\/p><p class=\"ln\"><b>Q25<\/b> They can still <mark>interact with others<\/mark>. That&rsquo;s often how new ideas get generated &ndash; by chatting to someone from a different profession.<\/p><p class=\"ln\"><b>Q26<\/b> It would mean they could still have their <mark>own space, specially designed for their needs<\/mark>.<\/p><p class=\"ln\"><b>Q27<\/b> People might worry about <mark>conditions which aren&rsquo;t serious at all<\/mark>.<\/p><p class=\"ln\"><b>Q28<\/b> That would encourage more people to <mark>cycle, instead of using their car<\/mark>. Much better for the planet.<\/p><p class=\"ln\"><b>Q29<\/b> <mark>Great for families with children<\/mark>. But what if you&rsquo;re disabled or elderly, and can&rsquo;t walk far?<\/p><p class=\"ln\"><b>Q30<\/b> That&rsquo;d be a great way for <mark>older people to get to know one another<\/mark>, especially if they&rsquo;re no longer going out to work.<\/p><p class=\"ln\"><b>Q31<\/b> They may also be negatively affected by having their <mark>routine<\/mark> disturbed. Like if they can&rsquo;t do the things they normally do.<\/p><p class=\"ln\"><b>Q32<\/b> They identified nearly a hundred <mark>trials<\/mark> involving a total of seven thousand patients. The researchers looked at what impact the music had.<\/p><p class=\"ln\"><b>Q33<\/b> A common factor was that the chosen music had a <mark>calming<\/mark> quality. A wide variety of music styles was evident.<\/p><p class=\"ln\"><b>Q34<\/b> More often though, the mode of delivery was by what are known as music <mark>pillows<\/mark>. These broadcast sound only audible to the person lying on them.<\/p><p class=\"ln\"><b>Q35<\/b> Surgical patients said they had no feelings of <mark>anxiety<\/mark> at any point, or those feelings were only slight.<\/p><p class=\"ln\"><b>Q36<\/b> Those who were given music didn&rsquo;t need as much <mark>medication<\/mark> to ease their pain as those who weren&rsquo;t played music.<\/p><p class=\"ln\"><b>Q37<\/b> The positive effects were greater when patients were <mark>awake<\/mark>. It even worked when patients were played music under general anaesthetic.<\/p><p class=\"ln\"><b>Q38<\/b> The researchers came to the conclusion that it worked on patients by <mark>distraction<\/mark>. Something familiar gave them something they could control.<\/p><p class=\"ln\"><b>Q39<\/b> Recordings taken from <mark>nature<\/mark> can be just as good as music. Patients should be able to choose what they&rsquo;d like to listen to.<\/p><p class=\"ln\"><b>Q40<\/b> The team now plan to focus their next research on the most appropriate <mark>volume<\/mark> to play the music at. I look forward to reading the results.<\/p>", "trtype": "snippets"}];

const listEl=document.getElementById('list');
const npTitle=document.getElementById('npTitle'), npSub=document.getElementById('npSub');
const seek=document.getElementById('seek'), curEl=document.getElementById('cur'), durEl=document.getElementById('dur');
const playBtn=document.getElementById('play'), rateBtn=document.getElementById('rate');
let cur=-1, audio=null, curRate=1, seeking=false, autoChain=0;
const dead=new Set();

function fmt(s){ if(!isFinite(s)||s<0)return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
// resume positions are keyed by the track's name, not its index — adding a new
// test shifts every index, which used to restore the wrong position.
function posKey(i){ return 'lp_pos::'+PLAYLIST[i].key; }
function savedPos(i){ const v=parseFloat(localStorage.getItem(posKey(i))||'0'); return isFinite(v)&&v>0?v:0; }

// header stats
(function(){
  const withTr=PLAYLIST.filter(t=>t.tr).length;
  const st=document.getElementById('stats');
  st.innerHTML=`<span class="chip">${PLAYLIST.length} tracks</span>`+
    `<span class="chip">${withTr} with script</span>`;
})();

// build list grouped by book
if(!PLAYLIST.length){ document.getElementById('empty').style.display='block'; }
let lastGroup=null;
PLAYLIST.forEach((tk,i)=>{
  if(tk.group!==lastGroup){ lastGroup=tk.group; const g=document.createElement('div'); g.className='grp'; g.textContent=tk.group; listEl.appendChild(g); }
  const card=document.createElement('div'); card.className='card'; card.id='card-'+i;
  const scriptBtn = tk.tr ? `<button class="scriptbtn" aria-expanded="false" aria-label="Show script">📄 Script <span class="cv">▼</span></button>` : '';
  card.innerHTML=
    `<div class="trk">`+
      `<div class="idx">${i+1}</div>`+
      `<div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>`+
      `<div class="meta"><div class="t">${tk.label}</div><div class="d">${tk.media}</div></div>`+
      scriptBtn+
      `<span class="badge ${tk.offline?'off':'on'}" id="badge-${i}">${tk.offline?'offline':'online'}</span>`+
    `</div>`+
    `<div class="panel" id="panel-${i}"></div>`;
  card.querySelector('.trk').addEventListener('click',()=>{
    // tapping the track that is already playing pauses it, instead of doing nothing
    if(i===cur && audio){ autoChain=0; if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); return; }
    selectTrack(i,true);
  });
  const sb=card.querySelector('.scriptbtn');
  if(sb) sb.addEventListener('click',(e)=>{ e.stopPropagation(); togglePanel(i,sb); });
  listEl.appendChild(card);
});

function togglePanel(i, btn){
  const panel=document.getElementById('panel-'+i);
  const open=panel.classList.toggle('open');
  if(open && !panel.dataset.filled){
    const tk=PLAYLIST[i];
    const cap = tk.trtype==='snippets' ? 'Answer script — key lines' : 'Transcript';
    panel.innerHTML=`<p class="cap">${cap}</p>`+tk.tr;
    panel.dataset.filled='1';
  }
  btn.setAttribute('aria-expanded', open?'true':'false');
}

function el(i){ return document.getElementById(PLAYLIST[i].id); }

function markDead(i){
  dead.add(i);
  const c=document.getElementById('card-'+i); if(c) c.classList.add('dead');
  const b=document.getElementById('badge-'+i);
  if(b){ b.className='badge bad'; b.textContent='unavailable'; }
}

function showErr(msg){ npSub.textContent=msg; npSub.classList.add('err'); }
function clearErr(tk){ npSub.textContent=tk.media; npSub.classList.remove('err'); }

function selectTrack(i, autoplay){
  if(i<0||i>=PLAYLIST.length){ // walked off the end of the playlist — stop cleanly
    if(audio) audio.pause();
    return;
  }
  if(audio && cur!==i) audio.pause();
  document.querySelectorAll('.card').forEach(r=>r.classList.remove('active','playing'));
  const card=document.getElementById('card-'+i); if(card) card.classList.add('active');
  cur=i; const tk=PLAYLIST[i];
  audio=el(i);
  // the element is preload="none" so nothing downloads until a track is chosen;
  // once chosen we want its duration even while paused
  if(audio.preload!=='metadata'){ audio.preload='metadata'; audio.load(); }
  audio.playbackRate=curRate;
  npTitle.textContent=tk.label;
  clearErr(tk);
  if(dead.has(i)) showErr('Audio unavailable — the source link is dead.');
  wire(audio);
  updateMediaSession(tk);
  localStorage.setItem('lp_last', i);
  // show the stored position right away, before any metadata arrives
  const p=savedPos(i);
  curEl.textContent=fmt(audio.currentTime||p);
  durEl.textContent=fmt(audio.duration||0);
  seek.value=(audio.duration?String(Math.round((audio.currentTime||p)/audio.duration*1000)):'0');
  if(autoplay) audio.play().catch(()=>{ playBtn.textContent='▶'; });
}

let wired=new WeakSet();
function wire(a){
  if(wired.has(a)) return;
  wired.add(a);
  a.addEventListener('timeupdate',()=>{
    if(a!==audio) return;
    if(!seeking && a.duration) seek.value=String(Math.round(a.currentTime/a.duration*1000));
    if(!seeking) curEl.textContent=fmt(a.currentTime);
    durEl.textContent=fmt(a.duration);
    if(cur>=0) localStorage.setItem(posKey(cur), a.currentTime);
  });
  a.addEventListener('loadedmetadata',()=>{
    if(a!==audio) return;
    a.playbackRate=curRate;          // some browsers reset the rate on load
    durEl.textContent=fmt(a.duration);
    const p=savedPos(cur);
    if(p>0 && p<a.duration-2) a.currentTime=p;
    syncPosition(a);
  });
  a.addEventListener('play',()=>{ if(a===audio){ playBtn.textContent='❚❚'; const c=document.getElementById('card-'+cur); if(c)c.classList.add('playing'); syncPosition(a); } });
  a.addEventListener('pause',()=>{ if(a===audio){ playBtn.textContent='▶'; const c=document.getElementById('card-'+cur); if(c)c.classList.remove('playing'); } });
  a.addEventListener('ratechange',()=>{ if(a===audio) syncPosition(a); });
  a.addEventListener('ended',()=>{
    if(a!==audio) return;
    localStorage.removeItem(posKey(cur));   // a finished track restarts from 0
    autoChain=0;
    selectTrack(cur+1, true);
  });
  a.addEventListener('error',()=>{
    if(a!==audio) return;
    const i=cur;
    markDead(i);
    playBtn.textContent='▶';
    showErr('Audio unavailable — the source link is dead.');
    // during continuous play, hop over dead tracks instead of stalling —
    // but never run away through the whole playlist
    if(autoChain>0 && autoChain<6 && i+1<PLAYLIST.length){ autoChain++; selectTrack(i+1,true); }
  });
}

playBtn.addEventListener('click',()=>{ autoChain=1; if(cur<0){ selectTrack(0,true); return; } if(audio.paused) audio.play().catch(()=>{ playBtn.textContent='▶'; }); else audio.pause(); });
document.getElementById('next').addEventListener('click',()=>{ autoChain=1; selectTrack(cur<0?0:cur+1,true); });
document.getElementById('prev').addEventListener('click',()=>{ autoChain=1; if(cur<0){selectTrack(0,true);return;} if(audio.currentTime>3){audio.currentTime=0;} else selectTrack(cur-1,true); });
document.getElementById('fwd').addEventListener('click',()=>{ if(audio&&audio.duration) audio.currentTime=Math.min(audio.duration,audio.currentTime+15); });
document.getElementById('back').addEventListener('click',()=>{ if(audio) audio.currentTime=Math.max(0,audio.currentTime-15); });
// while a finger is on the slider, timeupdate must not fight the drag
seek.addEventListener('pointerdown',()=>{ seeking=true; });
seek.addEventListener('input',()=>{ if(audio&&audio.duration) curEl.textContent=fmt((+seek.value)/1000*audio.duration); });
function commitSeek(){ if(audio&&audio.duration) audio.currentTime=(+seek.value)/1000*audio.duration; seeking=false; }
seek.addEventListener('change',commitSeek);
seek.addEventListener('pointerup',commitSeek);
seek.addEventListener('pointercancel',()=>{ seeking=false; });

const rateMenu=document.getElementById('rateMenu');
const rateOpts=Array.prototype.slice.call(rateMenu.querySelectorAll('.rate-opt'));
function openRate(o){ rateMenu.hidden=!o; rateBtn.setAttribute('aria-expanded', o?'true':'false'); }
function applyRate(r){
  curRate=r; if(audio) audio.playbackRate=r;
  rateBtn.textContent=r+'×';
  rateOpts.forEach(x=>x.classList.toggle('active', parseFloat(x.dataset.rate)===r));
  localStorage.setItem('lp_rate', String(r));
}
rateBtn.addEventListener('click',(e)=>{ e.stopPropagation(); openRate(rateMenu.hidden); });
rateOpts.forEach(o=>o.addEventListener('click',(e)=>{ e.stopPropagation(); applyRate(parseFloat(o.dataset.rate)); openRate(false); }));
document.addEventListener('click',()=>openRate(false));

// keyboard: space plays/pauses, arrows nudge 15s
document.addEventListener('keydown',(e)=>{
  const t=e.target;
  // e.target can be the document itself when nothing is focused
  if(t&&t.closest&&t.closest('input,textarea,button,[contenteditable]')) return;
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); document.getElementById('back').click(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); document.getElementById('fwd').click(); }
});

function syncPosition(a){
  // without this the lock-screen / car scrubber stays frozen at 0:00
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if(!isFinite(a.duration)||a.duration<=0) return;
  try{ navigator.mediaSession.setPositionState({duration:a.duration, playbackRate:a.playbackRate||1, position:Math.min(a.currentTime,a.duration)}); }catch(_){}
}

function updateMediaSession(tk){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:tk.label, artist:tk.media, album:'Listening Player'});
  const set=(k,fn)=>{ try{ navigator.mediaSession.setActionHandler(k,fn); }catch(_){} };
  set('play',()=>audio&&audio.play());
  set('pause',()=>audio&&audio.pause());
  set('previoustrack',()=>selectTrack(cur-1,true));
  set('nexttrack',()=>selectTrack(cur+1,true));
  set('seekbackward',(d)=>{ if(audio) audio.currentTime=Math.max(0,audio.currentTime-((d&&d.seekOffset)||15)); });
  set('seekforward',(d)=>{ if(audio&&audio.duration) audio.currentTime=Math.min(audio.duration,audio.currentTime+((d&&d.seekOffset)||15)); });
  set('seekto',(d)=>{ if(audio&&d&&typeof d.seekTime==='number') audio.currentTime=d.seekTime; });
}

// restore speed, then the last selection (paused)
const savedRate=parseFloat(localStorage.getItem('lp_rate')||'1');
if([0.75,1,1.25,1.5,2].indexOf(savedRate)>=0) applyRate(savedRate);
const last=parseInt(localStorage.getItem('lp_last')||'-1',10);
if(last>=0 && last<PLAYLIST.length) selectTrack(last,false);
</script>
</body>
</html>
