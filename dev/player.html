<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1e6de6"/>
<title>Listening Player</title>
<style>
  :root{
    --bg:#f4f7fb;--card:#fff;--line:#e6eaf1;--ink:#111827;--ink2:#6b7280;
    --blue:#1e6de6;--blue2:#3b82f6;--blued:#0f2f66;--bluebg:#eff6ff;
    --green:#16a34a;--greenbg:#effdf4;--amber:#b45309;--amberbg:#fff7ed;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:196px}
  .wrap{max-width:660px;margin:0 auto;padding:16px 16px 24px}
  /* hero */
  .hero{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff;border-radius:18px;
    padding:22px 20px;box-shadow:0 10px 30px rgba(30,109,230,.25);margin-bottom:18px}
  .hero h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em;font-weight:800}
  .hero p{margin:0;font-size:13px;color:#dbeafe;line-height:1.5}
  .hero .stats{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(4px)}
  /* group heading */
  .grp{margin:20px 4px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink2);font-weight:800}
  /* track card */
  .card{border:1px solid var(--line);background:var(--card);border-radius:14px;
    margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden;transition:.14s}
  .card.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,109,230,.14),var(--shadow)}
  .trk{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
  .card:hover{border-color:#c9d6ee}
  .card.active .trk{background:var(--bluebg)}
  .idx{width:34px;height:34px;flex:none;border-radius:10px;background:#eef2f8;color:var(--ink2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .card.active .idx{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff}
  .meta{min-width:0;flex:1}
  .meta .t{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .d{font-size:12px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;flex:none;letter-spacing:.02em}
  .badge.off{background:var(--greenbg);color:var(--green)}
  .badge.on{background:var(--amberbg);color:var(--amber)}
  .badge.bad{background:#fef2f2;color:#b91c1c}
  .card.dead .meta .t,.card.dead .idx{opacity:.55}
  .bar .st.err{color:#b91c1c;font-weight:650}
  /* equalizer (now playing) */
  .eq{display:none;align-items:flex-end;gap:2px;height:16px;width:16px;flex:none}
  .card.playing .eq{display:inline-flex}
  .eq i{width:3px;background:var(--blue);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(1){animation-delay:-.2s}.eq i:nth-child(2){animation-delay:-.5s}.eq i:nth-child(3){animation-delay:-.1s}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  /* script toggle + panel */
  .scriptbtn{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
    color:var(--blue);background:var(--bluebg);border:1px solid #d3e2fb;border-radius:999px;
    padding:5px 10px;cursor:pointer;transition:.12s}
  .scriptbtn:hover{background:#e0edff}
  .scriptbtn .cv{transition:transform .18s;font-size:9px}
  .scriptbtn[aria-expanded="true"] .cv{transform:rotate(180deg)}
  .panel{display:none;border-top:1px solid var(--line);background:#f8fafc;
    padding:14px 16px;max-height:340px;overflow:auto;font-size:14px;line-height:1.7}
  .panel.open{display:block}
  .panel .cap{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink2);margin:0 0 8px}
  .panel .ln{margin:0 0 9px}
  .panel .ln b{color:var(--blued);font-weight:750;margin-right:4px}
  .panel .sys{margin:0 0 9px;font-style:italic;color:var(--ink2);font-size:13px}
  .panel mark{background:#fff3bf;color:#7a5b00;padding:0 3px;border-radius:3px;font-weight:700}
  .empty{color:var(--ink2);padding:44px 0;text-align:center}
  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));z-index:50;
    box-shadow:0 -6px 24px rgba(16,24,40,.06)}
  .bar .inner{max-width:660px;margin:0 auto}
  .bar .title{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .st{font-size:12px;color:var(--ink2);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seekrow{display:flex;align-items:center;gap:10px}
  .time{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:5px;
    background:#e2e8f2;flex:1;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--blue);box-shadow:0 0 0 3px rgba(30,109,230,.18);border:2px solid #fff}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid #fff;border-radius:50%;background:var(--blue)}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px}
  .cbtn{background:#eef2f8;color:var(--ink);border:none;border-radius:11px;height:44px;min-width:44px;
    padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.12s}
  .cbtn:hover{background:#e2e8f2}
  .cbtn.play{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff;min-width:62px;font-size:19px;
    box-shadow:0 4px 12px rgba(30,109,230,.3)}
  .cbtn.small{font-size:12px;font-weight:800;color:var(--ink2);background:transparent}
  .cbtn.small:hover{background:#eef2f8}
  /* speed popover */
  .rate-wrap{position:relative;display:inline-flex}
  .rate-menu{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(2,6,23,.2);padding:5px;min-width:136px;z-index:60}
  .rate-menu[hidden]{display:none}
  .rate-menu .rl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:5px 10px 3px}
  .rate-opt{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;background:none;border:none;
    color:var(--ink);font-size:13px;font-weight:650;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
  .rate-opt:hover{background:#f1f5f9}
  .rate-opt.active{background:var(--bluebg);color:var(--blue)}
  .rate-opt.active::after{content:'✓';font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🎧 Listening Player</h1>
    <p>Every listening track in one place — tap to play, plays continuously. Tap <b>Script</b> to read along. <b>offline</b> tracks work with no signal; <b>online</b> need internet.</p>
    <div class="stats" id="stats"></div>
  </div>
  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">No listening tracks found.</div>
</div>

<div class="bar">
  <div class="inner">
    <div class="title" id="npTitle">Select a track</div>
    <div class="st" id="npSub">—</div>
    <div class="seekrow">
      <span class="time" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"/>
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="ctrls">
      <div class="rate-wrap">
        <button class="cbtn small" id="rate" title="Playback speed" aria-haspopup="true" aria-expanded="false">1×</button>
        <div class="rate-menu" id="rateMenu" role="menu" hidden>
          <div class="rl">Speed</div>
          <button class="rate-opt" data-rate="0.75" role="menuitemradio">0.75×</button>
          <button class="rate-opt active" data-rate="1" role="menuitemradio">Normal</button>
          <button class="rate-opt" data-rate="1.25" role="menuitemradio">1.25×</button>
          <button class="rate-opt" data-rate="1.5" role="menuitemradio">1.5×</button>
          <button class="rate-opt" data-rate="2" role="menuitemradio">2×</button>
        </div>
      </div>
      <button class="cbtn" id="prev" title="Previous" aria-label="Previous">⏮</button>
      <button class="cbtn" id="back" title="Back 15s" aria-label="Back 15 seconds">−15</button>
      <button class="cbtn play" id="play" aria-label="Play">▶</button>
      <button class="cbtn" id="fwd" title="Forward 15s" aria-label="Forward 15 seconds">+15</button>
      <button class="cbtn" id="next" title="Next" aria-label="Next">⏭</button>
    </div>
  </div>
</div>

<script>
const PLAYLIST = [{"id": "t0", "key": "Cambridge 18|Test 1", "group": "Cambridge 18", "label": "Test 1", "media": "Cambridge 18 — Test 1", "offline": false, "tr": "", "trtype": ""}, {"id": "t1", "key": "Cambridge 20|Test 1 · Part 1", "group": "Cambridge 20", "label": "Test 1 · Part 1", "media": "Cambridge 20 — Test 1, Part 1", "offline": false, "tr": "<p class=\"ln\"><b>WOMAN<\/b> I’ve been meaning to ask you for some advice about restaurants. I need to book somewhere to celebrate my sister’s 30th birthday, and I liked the sound of that place you went to for your mum’s 50th.<\/p><p class=\"ln\"><b>MAN<\/b> The Junction. Yeah, I’d definitely recommend that for a special occasion. We had a great time there. Everyone really enjoyed it.<\/p><p class=\"ln\"><b>WOMAN<\/b> Where is it again? I can’t remember.<\/p><p class=\"ln\"><b>MAN<\/b> It’s on Grayson Street, only about a two-minute walk from the station.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh that’s good. I prefer not to have to drive anywhere but I don’t want to have to walk too far either.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, the location’s perfect, but that’s not necessarily why I’d recommend it. The food’s amazing. If you like fish, it’s probably the best restaurant in town for that. It’s always really fresh and there are lots of interesting dishes to choose from. But all the food is good there.<\/p><p class=\"ln\"><b>WOMAN<\/b> Is it really expensive?<\/p><p class=\"ln\"><b>MAN<\/b> It’s certainly not cheap, but for a special occasion I think it’s fine. It’s got a great atmosphere and before dinner you can go up on the roof and have a drink. It’s really nice up there, but you need to book. It’s very popular as the views are spectacular.<\/p><p class=\"ln\"><b>WOMAN<\/b> Sounds good. So that’s definitely a possibility then. Is there anywhere else you can think of?<\/p><p class=\"ln\"><b>MAN<\/b> If you want somewhere a bit less formal, then you could try Paloma.<\/p><p class=\"ln\"><b>WOMAN<\/b> Where’s that? I haven’t heard of it.<\/p><p class=\"ln\"><b>MAN<\/b> No, it’s quite new. It’s only been open a few months, but it’s got a great reputation already. It’s in a really beautiful old building on Bow Street.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, I think I know where you mean. Right beside the cinema.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, that’s it. I’ve only been there a couple of times, but I was really impressed. The chef used to work at Don Felipe’s, apparently. I was really sorry when that closed down.<\/p><p class=\"ln\"><b>WOMAN<\/b> So is all the food they serve Spanish, then?<\/p><p class=\"ln\"><b>MAN<\/b> Yeah. You can get lots of small dishes to share, which always works really well if you’re in a group.<\/p><p class=\"ln\"><b>WOMAN<\/b> Hmm. Worth thinking about.<\/p><p class=\"ln\"><b>MAN<\/b> Yeah. There’s a lively atmosphere and the waiters are really friendly. The only thing is that you need to pay a £50 deposit to book a table.<\/p><p class=\"ln\"><b>WOMAN<\/b> A lot of restaurants are doing that these days. I should have a look at the menu to check if there is a good choice of vegetarian dishes. A couple of my friends have stopped eating meat.<\/p><p class=\"ln\"><b>MAN<\/b> Not sure. I’d say the selection of those would be quite limited.<\/p><p class=\"sys\">Before you hear the rest of the conversation, you have some time to look at questions 5 to 10. Now listen and answer questions 5 to 10.<\/p><p class=\"ln\"><b>MAN<\/b> I’ve just thought of another idea. Have you been to the Audley?<\/p><p class=\"ln\"><b>WOMAN<\/b> No, don’t think I’ve heard of it. How’s it spelt?<\/p><p class=\"ln\"><b>MAN<\/b> A-U-D-L-E-Y. You must have heard of it. There’s been a lot about it in the press.<\/p><p class=\"ln\"><b>WOMAN<\/b> I don’t tend to pay much attention to that kind of thing. So where is it exactly?<\/p><p class=\"ln\"><b>MAN<\/b> It’s in that hotel near Baxter Bridge, on the top floor.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, the views would be incredible from up there.<\/p><p class=\"ln\"><b>MAN<\/b> Yeah, I’d love to go. I can’t think of the chef’s name, but she was a judge on that TV cookery show recently. And she’s written a couple of cookery books.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, Angela Frayne.<\/p><p class=\"ln\"><b>MAN<\/b> That’s the one. Anyway, it had excellent reviews from all the newspapers.<\/p><p class=\"sys\">(The remainder of Part 1 — the Audley’s local ingredients, set-lunch price and portion size, answers 8–10 — is not included in the available audioscript.)<\/p>", "trtype": "full"}, {"id": "t2", "key": "Cambridge 20|Test 1 · Part 2", "group": "Cambridge 20", "label": "Test 1 · Part 2", "media": "Cambridge 20 — Test 1, Part 2", "offline": false, "tr": "<p class=\"ln\"><b>HEATHER<\/b> Hello and welcome. My name’s Heather McCallum and I’m one of the potters who work here at Edelman Pottery. Before we go into the workshop, I just want to say a bit about the craft of pottery. Then we’ll have a look at the equipment and you can try making a pot of your own. Like many people, I’m sure you know that pottery as an art form is tens of thousands of years old. And we know this because it stands the test of time. Things like baskets and pictures don’t survive on the earth in the same way that pots do, and even if ancient pots are found in small pieces they still provide a lot of information about the past. There’s no doubt that pottery has given archaeologists a fascinating insight into how ancient peoples lived. The shape of an artefact may have been lost but archaeologists can tell whether the pots were for, say, storage or cooking by examining the impressions on the clay, the scratches from tools, and the clay itself can reveal where the pots came from.<\/p><p class=\"ln\"><b>HEATHER<\/b> When I ask people why they want to take a pottery class with me, they sometimes talk about these things. Like our ancestors, they hope that something they create will also last longer than they do, that their work, whether it is good or not, might say something about humanity many years after their death. Of course, you will all have your own reasons for coming here. As far as I’m concerned, what I love most is the concentration you need to make a good pot. That focus takes you away from the stresses of everyday life. If you’re elderly, it’s also good exercise for hands and wrists and helps with arthritis. And of course, it’s a fun activity for children because it’s so messy.<\/p><p class=\"ln\"><b>HEATHER<\/b> Here at Edelman Pottery, we show you some of the basic pottery techniques so that you can use these to create whatever you wish — a gift for a friend, perhaps. Like nearly everyone who comes here, I’m sure this is the first time you will have tried the art, so we’ll keep things simple today. Now, before we move on, can I just say a word about what you’re wearing? As we said in our email, please remove any watches, necklaces etc and put them somewhere safe. If you have long hair do tie it back now. We provide aprons later but I trust your clothes are old but comfortable, not your favourite T-shirt or jeans.<\/p><p class=\"sys\">Before you hear the rest of the talk, you have some time to look at questions 17 to 20. Now listen and answer questions 17 to 20.<\/p><p class=\"ln\"><b>HEATHER<\/b> So now we’re in the workshop. Have a look around. There’s a lot going on. To make pottery that will last, you need a potter’s wheel, a kiln — which is basically a very hot oven where you fire the pottery — and some tools. So, first, the kiln. If you look over in the far corner, you’ll see one of ours. Since their invention, kilns have changed very little, though in the past 20 years a lot of progress has been made in temperature control. Basically, a kiln removes the water from clay at temperatures of around 1000 degrees Celsius. This allows anything you’ve made to set permanently in shape. It’s a pretty ugly heavy object that’s hard to keep in a house or flat, so most people don’t have one.<\/p><p class=\"ln\"><b>HEATHER<\/b> You may think, can’t I use my oven? Well, that’s possible, but domestic ovens don’t really get hot enough and eventually the clay will crack and fall apart. Some people fire pottery in a fire pit outside, but bear in mind that can be dangerous. You also need to know about safety procedures for kilns as they release toxic compounds into the air. Every potter needs a potter’s wheel. This machine is used to shape the clay into an object with circular walls or sides, such as a bowl. Its invention revolutionised the pottery industry, allowing multiple items to be produced in a day. Lastly, there are a number of different tools that potters use, depending on what they want to make. When you start, your hands can make all kinds of shapes and curves without relying on a sculpting tool. However, there are some basic tools that you will need to handle the clay on the wheel. Some look very strange and have even odder names that you may find hard to remember. Rather than go through them all now, I’ll just name a few tools as we go along. We can provide these and I wouldn’t recommend spending money on them yet. So, let’s try making a pot of your own. If you sit down…<\/p>", "trtype": "full"}, {"id": "t3", "key": "Cambridge 20|Test 1 · Part 3", "group": "Cambridge 20", "label": "Test 1 · Part 3", "media": "Cambridge 20 — Test 1, Part 3", "offline": false, "tr": "<p class=\"ln\"><b>TAMARA<\/b> Shall we go through the notes we’ve made from our research into loneliness now, Dev?<\/p><p class=\"ln\"><b>DEV<\/b> OK, Tamara. It’s been a real eye-opener. I had no idea that loneliness has been increasing steadily for the last 20 years.<\/p><p class=\"ln\"><b>TAMARA<\/b> I know. And it’s the same all over the world. The downside of a modern lifestyle, I guess.<\/p><p class=\"ln\"><b>DEV<\/b> Did you come to any conclusions about what the reasons for the increase are?<\/p><p class=\"ln\"><b>TAMARA<\/b> Well, I’d assumed it was mainly an issue for the elderly, but in fact it’s something which affects young people just as much.<\/p><p class=\"ln\"><b>DEV<\/b> So nothing really to do with longer lifespans. What about social media? In my case, far from making me feel isolated, it actually does the opposite, doesn’t it?<\/p><p class=\"ln\"><b>TAMARA<\/b> It definitely does more good than harm. I’d say loneliness has a lot to do with the way cities are designed. People living in high flats with not much opportunity to speak to their neighbours.<\/p><p class=\"ln\"><b>DEV<\/b> I think you’re right.<\/p><p class=\"ln\"><b>TAMARA<\/b> Another possible reason is that people are having fewer children and don’t live in large extended family groups.<\/p><p class=\"ln\"><b>DEV<\/b> But in this country anyway, that all changed decades ago. And yet loneliness is a more recent problem.<\/p><p class=\"ln\"><b>TAMARA<\/b> I suppose so. A more plausible explanation is that people are having to move around for work and often end up living miles away from their family and friends.<\/p><p class=\"ln\"><b>DEV<\/b> That’s true.<\/p><p class=\"ln\"><b>TAMARA<\/b> Looking at the studies on health risks and loneliness, there are claims that loneliness has as much impact as smoking 15 cigarettes a day.<\/p><p class=\"ln\"><b>DEV<\/b> Or similar to the risks caused by obesity. But I’m not sure there’s enough evidence for some of these claims.<\/p><p class=\"ln\"><b>TAMARA<\/b> Well, what about that one in Finland, which showed that loneliness increased the risk of cancer by about 10%? And those findings have been supported by other studies too.<\/p><p class=\"ln\"><b>DEV<\/b> You’re right about that one. I was actually thinking of the studies on dementia. Some found no association between loneliness and dementia, and others found the opposite.<\/p><p class=\"ln\"><b>TAMARA<\/b> Not exactly reliable, then. There’s been a lot of research on cardiovascular disease and whether loneliness contributes to that.<\/p><p class=\"ln\"><b>DEV<\/b> Yes, I read that it was hard to reach a judgment, as the definition of loneliness varied quite a lot, and the responses from participants were too subjective. But there’s no doubt that loneliness contributes to a weakened immune system.<\/p><p class=\"ln\"><b>TAMARA<\/b> Unquestionably. The data on that is sound.<\/p><p class=\"ln\"><b>DEV<\/b> What did you think about the evolutionary theory of loneliness?<\/p><p class=\"ln\"><b>TAMARA<\/b> Well, I thought the idea that loneliness evolved because it motivated people to be with other people is quite convincing. Survival often depended on group cooperation.<\/p><p class=\"ln\"><b>DEV<\/b> But I don’t think there’s enough evidence to claim that there must be a group of neurons in our brains which influence social behaviour by making us feel bad when we’re alone.<\/p><p class=\"ln\"><b>TAMARA<\/b> There are a few studies which support the theory, but not conclusively enough. More evidence is needed.<\/p><p class=\"ln\"><b>DEV<\/b> And anyway, this theory’s not really useful when it comes to solving the problem of loneliness today.<\/p><p class=\"ln\"><b>TAMARA<\/b> True.<\/p><p class=\"sys\">Now listen and answer questions 27 to 30.<\/p><p class=\"ln\"><b>DEV<\/b> Should we look at the relationship between loneliness and mental health now?<\/p><p class=\"ln\"><b>TAMARA<\/b> OK. So, loneliness and depression are clearly related and that’s been recognised by various governments around the world. But unlike depression, loneliness has no recognised clinical form.<\/p><p class=\"ln\"><b>DEV<\/b> There’s no available diagnosis or effective treatment and that’s not likely to change.<\/p><p class=\"ln\"><b>TAMARA<\/b> I don’t think so either. I was thinking we should start our presentation with an example from our own experience. I’d like to talk about how lonely I was when I started university, being away from home for the first time and all that.<\/p><p class=\"ln\"><b>DEV<\/b> Good idea. Everyone will be able to relate to that, although a lot of students were probably too embarrassed to admit to it.<\/p><p class=\"ln\"><b>TAMARA<\/b> Yeah. We could discuss ways of dealing with loneliness as well, like just talking to strangers.<\/p><p class=\"ln\"><b>DEV<\/b> Loads of studies have shown that interactions with shop assistants and bar staff make people feel more optimistic and relaxed.<\/p><p class=\"ln\"><b>TAMARA<\/b> I don’t know about that, but it must make people feel more connected with their community.<\/p><p class=\"ln\"><b>DEV<\/b> True, although you need to be a certain kind of person to be able to just strike up a conversation.<\/p><p class=\"ln\"><b>TAMARA<\/b> Good point. We should say something about solitude and how being alone and being lonely aren’t the same thing. It’s strange the way some people can’t stand being by themselves while others love it.<\/p><p class=\"ln\"><b>DEV<\/b> Yeah, the research shows a certain amount of solitude is beneficial for wellbeing, which I appreciate, but being alone isn’t something I actually like. I’d never choose to go on holiday alone, for example.<\/p><p class=\"ln\"><b>TAMARA<\/b> Me neither.<\/p><p class=\"ln\"><b>DEV<\/b> Well, let’s not…<\/p>", "trtype": "full"}, {"id": "t4", "key": "Cambridge 20|Test 1 · Part 4", "group": "Cambridge 20", "label": "Test 1 · Part 4", "media": "Cambridge 20 — Test 1, Part 4", "offline": false, "tr": "<p class=\"ln\"><b>LECTURER<\/b> It’s quite hard to think of a city that doesn’t have a big river running through it. If you think about the major cities in the world — Shanghai, New York, Mumbai, London — they’re nearly all built on rivers. When these cities were established hundreds or even thousands of years ago, the rivers were a big part of people’s lives. In 16th-century London, the quickest way to get from one part of the city to another was by river. But people also used the river for fishing, as the water then was relatively clean, and they would also go on boat trips up and down the river just for pleasure, as a relaxing escape from the noise and bustle of the city streets.<\/p><p class=\"ln\"><b>LECTURER<\/b> But as industries developed and populations increased, city rivers suffered. The rising number of people meant there was a huge increase in the amount of sewage discharged into the rivers. Rivers had always been used for this purpose, but when the number of inhabitants was so small, that wasn’t such a problem. However, as cities grew to over a million inhabitants, the impact on the rivers became more serious. In addition, other types of pollution increased, as factories were built beside the river and discharged their waste materials into the water. This got worse over time. As recently as 1957, scientists at London’s Natural History Museum declared that the River Thames was dead in biological terms, as the water was too filthy to support any kind of life.<\/p><p class=\"ln\"><b>LECTURER<\/b> But in recent years, as rivers lost their industrial function, cities have begun to recognise their true value and to take steps to clean them up. For example, the River Thames is now cleaner than it’s been for 150 years. These days you can see seals swimming in the water, and recently people had to try to rescue a whale, which had got lost and swum up the river from the sea by mistake. Unfortunately, they didn’t succeed, but the problem was disorientation rather than the quality of the water.<\/p><p class=\"ln\"><b>LECTURER<\/b> Then, all around the world, riverside areas are now seen as prime sites for development. Warehouses that were once used for storing goods are now being converted into expensive restaurants and also into apartments with river views, which are in great demand and sell for astronomical prices. In Los Angeles, on the west coast of the USA, an architect has plans to revitalise the banks of the river and to make a park there which can provide facilities for sports as well as a natural environment for relaxing in. It’s also hoped that the riverside can be used for other purposes: it’s been proposed that facilities could be provided for displaying projects related to various kinds of art that have been produced by local people, for example.<\/p><p class=\"ln\"><b>LECTURER<\/b> In the city of Paris, during the summer months of July and August, all the traffic is banned from the roads by the sides of the river, and the banks are transformed into beaches, where people can relax in deck chairs under potted palm trees, sunbathe or buy a drink or a snack while enjoying the view. But to make the most of our rivers in our increasingly crowded cities, we need to allow them to regain their original purpose and be used as a means of transport, reclaiming our streets from cars and lorries. To do this, we’ll have to shift more traffic back to the river, but this time…<\/p><p class=\"sys\">(The final section — passenger ferries, electric bikes and delivery drones, answers 38–40 — is not included in the available audioscript.)<\/p>", "trtype": "full"}, {"id": "t5", "key": "Cambridge 20|Test 2 · Part 1", "group": "Cambridge 20", "label": "Test 2 · Part 1", "media": "Cambridge 20 — Test 2, Part 1", "offline": false, "tr": "<p class=\"ln\"><b>WOMAN<\/b> It’s really good to see you, Tom. Since I had to give up work, I feel I’m losing touch with my friends and colleagues.<\/p><p class=\"ln\"><b>MAN<\/b> We really miss you in the office. We were all so sorry you had to leave. But you must be relieved to have more time to look after your mother. How is she?<\/p><p class=\"ln\"><b>WOMAN<\/b> Well she is very cheerful, but she needs a lot of help.<\/p><p class=\"ln\"><b>MAN<\/b> Have you tried to get any support from the local council?<\/p><p class=\"ln\"><b>WOMAN<\/b> No, I didn’t know I could.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, they offer different kinds of practical support. They realise that carers sometimes need time for all the other responsibilities they have, apart from the person they’re caring for, and also that they sometimes need a break.<\/p><p class=\"ln\"><b>WOMAN<\/b> Absolutely. OK, so tell me more. How do I go about getting this support?<\/p><p class=\"ln\"><b>MAN<\/b> Well, you’d have to have an assessment of your mother’s needs. That means someone would come round and talk to you about the situation and what you need. So, for a start, they’d want to know the amount of time you spend looking after your mother every day.<\/p><p class=\"ln\"><b>WOMAN<\/b> OK.<\/p><p class=\"ln\"><b>MAN<\/b> Then they’ll probably ask you what sorts of tasks you do for your mother during the day. Things like if she needs help with getting dressed, for example.<\/p><p class=\"ln\"><b>WOMAN<\/b> Right. I help her with that. And also I help her get into the shower in the morning.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, that sort of thing.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yes, that’s becoming a bit of a problem. She used to be very good at it, but not anymore.<\/p><p class=\"sys\">Before you hear the rest of the conversation, you have some time to look at questions 5 to 10. Now listen and answer questions 5 to 10.<\/p><p class=\"ln\"><b>MAN<\/b> And be ready to tell them about anything you find particularly difficult about caring for your mother.<\/p><p class=\"ln\"><b>WOMAN<\/b> So, recently I’ve noticed she’s started to have quite bad problems with her memory. If I wasn’t there, I think she’d forget to eat, for example. And often she doesn’t seem quite sure what day it is.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, tell them about that. And are there any physical difficulties you have caring for her? Lifting her, for example?<\/p><p class=\"ln\"><b>WOMAN<\/b> Yes, she’s quite heavy and I’m afraid of hurting my back. I’d be in real trouble if that happened.<\/p><p class=\"ln\"><b>MAN<\/b> They can give you advice about that and also about how to avoid the possibility of your mum having a fall.<\/p><p class=\"ln\"><b>WOMAN<\/b> Great. So once they’ve done this assessment, if I’m eligible, what happens next?<\/p><p class=\"ln\"><b>MAN<\/b> Well, they might support you financially. So they might help you with transport costs, like if you have to get a taxi to take your mother for an appointment, for example.<\/p><p class=\"ln\"><b>WOMAN<\/b> I usually drive her myself, actually. So, could I claim the petrol?<\/p><p class=\"ln\"><b>MAN<\/b> You could. And you can claim for the insurance too.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, right.<\/p><p class=\"ln\"><b>MAN<\/b> And if you need help with the housework, they can arrange for someone to come along once or twice a week. And one other thing. I hope you don’t mind me saying this, but it’s important you look after yourself. And it seems to me you’re under quite a bit of stress.<\/p><p class=\"ln\"><b>WOMAN<\/b> I am, yes.<\/p><p class=\"ln\"><b>MAN<\/b> Well, tell the council, because they may be able to give you some advice on how to minimise it.<\/p><p class=\"ln\"><b>WOMAN<\/b> Really? Though, actually, I feel so much better having talked to you. I’ll get in touch with the council straight away. Now, shall we go for coffee or something?<\/p>", "trtype": "full"}, {"id": "t6", "key": "Cambridge 20|Test 2 · Part 2", "group": "Cambridge 20", "label": "Test 2 · Part 2", "media": "Cambridge 20 — Test 2, Part 2", "offline": false, "tr": "<p class=\"ln\"><b>STEVE<\/b> Good morning everyone. I’m Steve Wainwright from Elmley Town Council and I organise the town’s volunteer scheme. I’m delighted you’re all interested in joining the scheme. Our volunteers help to create a sense of community among the many people who live in our historic town of Elmley and make residents and visitors feel welcome at local events.<\/p><p class=\"ln\"><b>STEVE<\/b> First, I’ll mention just a few of the activities that volunteers carry out. One is to walk around the town centre streets wearing our volunteer T-shirt. Tourists often ask how to get to a particular shop, and they might also be grateful for recommendations about what to visit.<\/p><p class=\"ln\"><b>STEVE<\/b> The town holds a large number of concerts each year and part of the volunteers’ role is to get everyone in the audience to the right place as smoothly as possible. You’d be surprised how many people buy tickets, then don’t check them, and head for the wrong section of the hall.<\/p><p class=\"ln\"><b>STEVE<\/b> Volunteers may get involved with community groups, such as sports clubs or gardeners’ associations. Here, the volunteers talk about how groups can help each other. For instance, a writing group might want to travel to another town to hear a talk by a well-known author, but may not know that another club has a coach they could travel in.<\/p><p class=\"ln\"><b>STEVE<\/b> The town produces a monthly magazine, and anyone who lives in the town can send in articles. It’s free to residents and is paid for by local businesses. That’s the responsibility of the council’s advertising department. We depend on volunteers, though, to find out what people think of events they’ve attended and any suggestions they have for the future; the volunteers then send a summary to the editors.<\/p><p class=\"ln\"><b>STEVE<\/b> There are a number of clubs for retired people and every year the council arranges a lunch for all the members. The volunteers welcome the guests, and when everyone’s sitting down and relaxing after the meal, some volunteers put on a show — usually around half an hour of songs and short plays. The club members really welcome the chance to chat to the volunteers at these events.<\/p><p class=\"ln\"><b>STEVE<\/b> The town council has a website, of course, and volunteers are asked to help by making sure residents know about it. It’s updated every day with information about future activities and we want as many people as possible to use it.<\/p><p class=\"sys\">Before you hear the rest of the talk, you have some time to look at questions 17 to 20. Now listen and answer questions 17 to 20.<\/p><p class=\"ln\"><b>STEVE<\/b> OK, now you know some of the things our volunteers do, I’ll go on to some practical matters. As you probably know, the town arranges three major festivals every year, and they all depend on a large number of volunteers. The book festival lasts three days, and uses several venues which all need volunteers. More are needed for the music festival because that lasts a whole week, and even more help is required for the science festival, even though it’s only two days long. It involves quite a lot of venues, though. It’s a good idea to help at the festival you’re most interested in, because you can attend most of the events for free.<\/p><p class=\"ln\"><b>STEVE<\/b> We try to use volunteers who are flexible, though, because some festival events are held outdoors and the weather may affect the size of the audience and even whether the event can take place, so there can be changes at short notice. What’s essential, though, is being able to get on well with other people and also to deal with someone who’s behaving badly, as occasionally happens.<\/p><p class=\"ln\"><b>STEVE<\/b> Our plan is to get you all working in September, after a week’s training starting on the 2nd, so we’ll be timetabling you for duties the following week from the 9th onward. Later, in the week beginning September 23rd, we have a chat with each of you to find out how you feel about being a volunteer and what extra support you need.<\/p><p class=\"ln\"><b>STEVE<\/b> As a thank you to the volunteers we arrange an annual event. In recent years we’ve had a party in the Town Hall and last year a barbecue in Chamber Park. Our forthcoming event is a trip along the canal from here to Dewhurst and back. It’s on Saturday, September the 28th. And if you’d like to attend, you can sign up once you start work. Now, this is the volunteer’s T-shirt.<\/p>", "trtype": "full"}, {"id": "t7", "key": "Cambridge 20|Test 2 · Part 3", "group": "Cambridge 20", "label": "Test 2 · Part 3", "media": "Cambridge 20 — Test 2, Part 3", "offline": false, "tr": "<p class=\"ln\"><b>ROSIE<\/b> Colin, I’m really struggling to think of a topic for our human geography assignment.<\/p><p class=\"ln\"><b>COLIN<\/b> Me too, Rosie. I’ll tell you what, let’s think about the different aspects of human geography and see if we can narrow the topic down a bit to help us decide.<\/p><p class=\"ln\"><b>ROSIE<\/b> OK. So one aspect is population. That would be all about population density and migration and so on. Lots of facts and statistics. Maybe a bit boring?<\/p><p class=\"ln\"><b>COLIN<\/b> Yeah, but quite straightforward to find on the internet.<\/p><p class=\"ln\"><b>ROSIE<\/b> Suppose so. How about health? I’d never thought about the links between that and geography until Professor Lee gave us that lecture on cholera — how in the 19th century a physician used street plans and plans of water supplies to find the source of a cholera epidemic.<\/p><p class=\"ln\"><b>COLIN<\/b> Yes, fascinating, wasn’t it? Or we could do something more general like economies.<\/p><p class=\"ln\"><b>ROSIE<\/b> So how financial and commercial factors are linked to the physical environment.<\/p><p class=\"ln\"><b>COLIN<\/b> Yeah.<\/p><p class=\"ln\"><b>ROSIE<\/b> I thought that had been taken off the syllabus for this year.<\/p><p class=\"ln\"><b>COLIN<\/b> Has it?<\/p><p class=\"ln\"><b>ROSIE<\/b> I’m not sure, but it might be best to avoid it.<\/p><p class=\"ln\"><b>COLIN<\/b> OK. Maybe we could do something on culture. We had that lecture about culture and geography last week.<\/p><p class=\"ln\"><b>ROSIE<\/b> I didn’t get much out of that. It was all so general and the lecturer didn’t give any useful examples.<\/p><p class=\"ln\"><b>COLIN<\/b> Yeah, I hardly took any notes. It didn’t seem worth it.<\/p><p class=\"ln\"><b>ROSIE<\/b> Me neither.<\/p><p class=\"ln\"><b>COLIN<\/b> We could focus on poverty. That’s something that’s a global problem.<\/p><p class=\"ln\"><b>ROSIE<\/b> The trouble is, Dr Lee was saying, that you have to be careful with some of the figures relating to poverty. They’re sometimes deliberately manipulated.<\/p><p class=\"ln\"><b>COLIN<\/b> You mean the information gets changed for political reasons?<\/p><p class=\"ln\"><b>ROSIE<\/b> That sort of thing, yes.<\/p><p class=\"sys\">Before you hear the rest of the discussion, you have some time to look at questions 26 to 30. Now listen and answer questions 26 to 30.<\/p><p class=\"ln\"><b>ROSIE<\/b> So what are we going to do our assignment on? I’ll tell you what. One of the possibilities we’ve discussed is urbanisation, and now over half the world population lives in cities. That’s really important.<\/p><p class=\"ln\"><b>COLIN<\/b> OK, good idea, Rosie. Let’s do that.<\/p><p class=\"ln\"><b>ROSIE<\/b> I love living in a big city but of course there are problems.<\/p><p class=\"ln\"><b>COLIN<\/b> Things like theft and robbery?<\/p><p class=\"ln\"><b>ROSIE<\/b> Yes, but where I come from, that’s linked to another more serious issue, which is that a lot of people don’t have jobs. That’s getting worse and worse. And we also still have quite a lot of people who are homeless, though that’s not quite so bad as it was.<\/p><p class=\"ln\"><b>COLIN<\/b> It would be nice to talk about some positive developments, like some of the new developments on the outskirts of cities.<\/p><p class=\"ln\"><b>ROSIE<\/b> Yeah, they’ve opened some massive new shopping centres outside my city.<\/p><p class=\"ln\"><b>COLIN<\/b> Yeah, the same with mine, but it means a lot of the shops in the city centre are closing down. But the outskirts are ideal for buildings that need a lot of space, like for conferences. They’ve opened a couple of big ones.<\/p><p class=\"ln\"><b>ROSIE<\/b> Yes, we’ve got some too. It’d be nicer to have more facilities for things like football too, but that’s not happening where I live.<\/p><p class=\"ln\"><b>COLIN<\/b> Same in my area.<\/p><p class=\"ln\"><b>ROSIE<\/b> We could include something about developing disused industrial sites. It seems like a good idea because you’re not doing any harm to the natural environment.<\/p><p class=\"ln\"><b>COLIN<\/b> Yeah, but aren’t the buildings architecturally significant?<\/p><p class=\"ln\"><b>ROSIE<\/b> Not really. And what people forget is that they often used quite dangerous materials, chemicals and things, which haven’t been properly cleared away, so the whole site has to be made safe.<\/p><p class=\"ln\"><b>COLIN<\/b> Hmm, that can’t be cheap. And I bet it’s often not budgeted for.<\/p><p class=\"ln\"><b>ROSIE<\/b> You’re right.<\/p><p class=\"ln\"><b>COLIN<\/b> Have you read about Masdar City?<\/p><p class=\"ln\"><b>ROSIE<\/b> In Abu Dhabi? Yes. It was designed to be a green city, wasn’t it? That might be a good example of a city which set out to depend entirely on renewable energy.<\/p><p class=\"ln\"><b>COLIN<\/b> Yes, we should say something about that. It was designed to be totally pedestrianised too, wasn’t it, with the transport underground.<\/p><p class=\"ln\"><b>ROSIE<\/b> Yes, and they had big plans for recycling to reduce waste to the lowest possible level. But let’s stick to talking about power sources.<\/p><p class=\"ln\"><b>COLIN<\/b> Then there’s that ecotown in England, Greenhill Abbots. It set out to conform to the usual principles, sustainability and so on. A lot of people were against it at first. They said the plans were unrealistic. I’m not sure how far they’ve got with it. I’ll check.<\/p><p class=\"ln\"><b>ROSIE<\/b> Right. So it looks as if we have a sort of plan.<\/p>", "trtype": "full"}, {"id": "t8", "key": "Cambridge 20|Test 2 · Part 4", "group": "Cambridge 20", "label": "Test 2 · Part 4", "media": "Cambridge 20 — Test 2, Part 4", "offline": false, "tr": "<p class=\"ln\"><b>SPEAKER<\/b> There are trends in food much as there are trends in clothing. Interest in food fashions has risen rapidly since the birth of the smartphone, when people first began taking photos of their food and instantly sharing them with their friends. The food industry in the UK in particular is obsessed with finding and exploiting the next big food trend. Marketeers aim to create a huge demand for a food item which was previously unknown or not needed.<\/p><p class=\"ln\"><b>SPEAKER<\/b> One of the most effective ways of promoting a new food product is by using social media influencers as brand ambassadors. In return for free samples, many influencers will post content about a product, although there are influencers with hundreds of thousands of followers who can command large fees for their services. Companies which sell vegan produce were pioneers in being able to increase sales really quickly in this way.<\/p><p class=\"ln\"><b>SPEAKER<\/b> For a food item to become really popular, it has to be readily available, so supermarkets have a role to play in creating a new food trend. They have dedicated teams closely following which new products or ingredients are trending on social media, and are particularly interested in what well-known chefs are putting on their menus.<\/p><p class=\"ln\"><b>SPEAKER<\/b> I’d like to look at a few examples of marketing campaigns which were really successful in launching a new fashion trend, starting in the 1990s with the avocado. A British PR company was hired to raise its profile and stimulate demand. They paid for a group of journalists to travel out to South Africa to meet avocado farmers. Articles written following this visit helped to educate the British public about the avocado, which at this time was certainly not the daily staple it’s since become. Advertisements were designed to promote the avocado as a superfood, rich in nutrients and therefore beneficial for health. Avocados became hugely fashionable, and within a few years UK avocado sales had grown from £13 million annually to around £150 million.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Oat milk is a recent example of a new product which became fashionable very quickly. Now there are many brands available, but one company which had early success was the Swedish brand Oatly. They attracted a lot of attention with a media campaign which used provocation as a way of getting their message across effectively. The fact that this campaign aggravated competitors producing milk from dairy cows was seen as a plus, as it helped to make oat milk seem cool. In the USA, the brand decided against a big retail launch in favour of getting the product into coffee chains, which removed the need for a big advertising budget. This proved far more effective than offering samples in supermarkets. Oat milk had an advantage over other alternative milk products, such as almond milk: many consumers prefer it because it has less of an impact on the environment. It requires significantly less water to produce and it also has a relatively low carbon footprint.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Norwegian skrei, a rarely available seasonal fish delicacy, otherwise known as Arctic cod, is now found on the menus of Michelin-starred restaurants throughout Europe. The demand for skrei has been used by a food marketing agency to build the reputation of Norway’s fisheries in general. Marketing surveys have shown that a significant number of shoppers now associate Norway with excellent seafood.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Food trends can be considered a good thing in some ways, as they can benefit farmers and food producers enormously, and the public can be encouraged to buy things which are more sustainably produced. But ethical concerns have been raised about the effects a surge in demand can cause. Quinoa is a classic example. This plant is native to Peru, and when demand peaked some years ago the price soared, making it unaffordable for local people. While the popularity of quinoa has benefited farmers financially, there have been other negative consequences. As demand grew, farmers began working the land all year round in order to produce more quinoa. One issue has been that the fertility of the soil decreased dramatically, which could potentially lead to desertification in some areas. Another example would be the case of…<\/p>", "trtype": "full"}, {"id": "t9", "key": "Cambridge 20|Test 3 · Part 1", "group": "Cambridge 20", "label": "Test 3 · Part 1", "media": "Cambridge 20 — Test 3, Part 1", "offline": false, "tr": "<p class=\"ln\"><b>MAN<\/b> Good morning.<\/p><p class=\"ln\"><b>WOMAN<\/b> Hi, this is Michelin Meyer. I’m renting your house on Archwood Avenue. I’m due to move in next week.<\/p><p class=\"ln\"><b>MAN<\/b> Oh, yes. Hello, Ms Meyer. What can I do for you?<\/p><p class=\"ln\"><b>WOMAN<\/b> When I viewed the house, I told you I’ll most probably need to rent some furniture, at least until I know whether my temporary work contract is going to be made permanent.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, of course. I remember. And I said I could give you some information about furniture rental companies in the city.<\/p><p class=\"ln\"><b>WOMAN<\/b> That’s right.<\/p><p class=\"ln\"><b>MAN<\/b> Well, the biggest company is called Peak Rentals. I’ve recommended them to other people and have always heard positive reports about them.<\/p><p class=\"ln\"><b>WOMAN<\/b> Could you give me an idea of their costs?<\/p><p class=\"ln\"><b>MAN<\/b> Sure. I actually have one of their brochures here. It says the monthly price per room starts at $105 and goes up to $239. That depends on which rooms you need furniture for, of course.<\/p><p class=\"ln\"><b>WOMAN<\/b> Sure. It’s just to get a general idea of how much it’s going to cost. And you said you had some positive feedback about this company?<\/p><p class=\"ln\"><b>MAN<\/b> Yes. People have mentioned that the furniture from Peak Rentals is more modern than any of the other companies. And also, once you place an order, the furniture will be delivered to you in just one or two days.<\/p><p class=\"ln\"><b>WOMAN<\/b> That would be really helpful.<\/p><p class=\"ln\"><b>MAN<\/b> Oh, and the brochure says that there’s a special offer at the moment. If you rent living room furniture — I believe that’s a set of chairs and a TV table — you’ll also get a lamp at no extra cost.<\/p><p class=\"ln\"><b>WOMAN<\/b> Okay, but you know, that price range you gave is more than I was hoping to pay.<\/p><p class=\"ln\"><b>MAN<\/b> Then you could try Aaron and Oliver.<\/p><p class=\"ln\"><b>WOMAN<\/b> Sorry, what and Oliver?<\/p><p class=\"ln\"><b>MAN<\/b> Aaron, double A — A-R-O-N.<\/p><p class=\"ln\"><b>WOMAN<\/b> OK, are they cheaper?<\/p><p class=\"ln\"><b>MAN<\/b> I’d say they are a mid-range company. But if you chose them you need to be aware that they charge an extra $12 every month in case of damage.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, I see. I’d have to do the maths carefully then.<\/p><p class=\"ln\"><b>MAN<\/b> Right. But one helpful thing is that they also do cleaning for customers.<\/p><p class=\"ln\"><b>WOMAN<\/b> For the furniture?<\/p><p class=\"ln\"><b>MAN<\/b> For the house.<\/p><p class=\"ln\"><b>WOMAN<\/b> Oh, I see. I probably won’t need that.<\/p><p class=\"sys\">Now listen and answer questions 6 to 10.<\/p><p class=\"ln\"><b>MAN<\/b> There’s another company called Larch Furniture. It’s quite new, and it has the lowest prices in town. That’s for both furniture and also electronic equipment.<\/p><p class=\"ln\"><b>WOMAN<\/b> Well, that would be good. I’m not bringing much with me, and I won’t have much time to go shopping after I start my job.<\/p><p class=\"ln\"><b>MAN<\/b> There are two things you need to know about Larch Furniture. First of all, you have to take out insurance on the furniture and you need to organise that yourself.<\/p><p class=\"ln\"><b>WOMAN<\/b> That wouldn’t be too hard.<\/p><p class=\"ln\"><b>MAN<\/b> Also, you can take out a contract for less than six months, but I figure that might not be a problem for you. You’re renting the house for 12 months after all, aren’t you?<\/p><p class=\"ln\"><b>WOMAN<\/b> Yes, okay. Well, I…<\/p><p class=\"ln\"><b>MAN<\/b> Sorry to interrupt. I just thought of another furniture rental company. It’s called Space Rentals, and it’s located very near to the house.<\/p><p class=\"ln\"><b>WOMAN<\/b> Okay.<\/p><p class=\"ln\"><b>MAN<\/b> I don’t have any information about their charges, so it’s best to use their app to find out what it would cost you to use them.<\/p><p class=\"ln\"><b>WOMAN<\/b> Okay, thanks. I’ll do that.<\/p><p class=\"ln\"><b>MAN<\/b> One good thing about that company is that if you don’t like the furniture once it’s delivered, you can request exchanges, as long as you do that within a week of receiving it.<\/p><p class=\"ln\"><b>WOMAN<\/b> That sounds really great. Okay, well, thanks very much. That’s so helpful.<\/p>", "trtype": "full"}, {"id": "t10", "key": "Cambridge 20|Test 3 · Part 2", "group": "Cambridge 20", "label": "Test 3 · Part 2", "media": "Cambridge 20 — Test 3, Part 2", "offline": false, "tr": "<p class=\"ln\"><b>HAYDEN<\/b> Hello, I’m Hayden. I’m one of the archaeologists investigating the site here at Bidcaster. This is the third summer for this community project, and most of the people digging here are volunteers. I’m a full-time archaeologist for the town council, but I was asked to join the project by NHA, a charity which sets up projects like this up and down the country. As you can see, we’re next to Bidcaster Castle, which is great because the owners let us use their facilities. So, how did we get to where we are today?<\/p><p class=\"ln\"><b>HAYDEN<\/b> Many archaeology projects happen when an ancient object is found, and in our case that object was a gold coin. Coins are often found by people using metal detectors to look for things buried in the ground, or coins are uncovered when wild animals like rabbits have been digging tunnels. Here, a walker found it on the ground after a rainstorm washed away some of the earth and sand. When the story of the gold coin hit the news, Peter Swift, an amateur historian, contacted me to say he believed there had been a village on this site, centuries before the castle was built. Just by chance, the team found some old maps and documents in our library, which showed 500-year-old drawings of ruined buildings on the grassy area between the outer stone walls of the castle and the river. We knew then we were onto something.<\/p><p class=\"ln\"><b>HAYDEN<\/b> Over the three summers the team has been here, we’ve found the remains of several buildings, and more broken pots than you can count. Normally you’d expect to find brooches and other jewellery, but we’re still waiting to uncover any such items. The people who once lived here were skilled at making tools from animal bones, as you’ll see when you visit the exhibition. Besides the discovery of the village, we’ve also found evidence of human activity on the other side of the river. No other houses or huts so far, but we can see the borders of an ancient field system. At one point we found a long wall and thought it was an ancient palace, but it turned out to be a modern wall.<\/p><p class=\"ln\"><b>HAYDEN<\/b> This summer’s work will end soon, but we’ll be back next summer. In the meantime, we’re putting on a series of guided tours for school groups this autumn. Oh, and maybe you saw the TV documentary about our project. That suggests the objects we’ve found are going to the town’s museum, but we don’t know that for sure yet.<\/p><p class=\"sys\">Before you hear the rest of the talk, you have some time to look at questions 17 to 20. Now listen and answer questions 17 to 20.<\/p><p class=\"ln\"><b>HAYDEN<\/b> When you enter the site, please make sure you keep to the paths at all times. There are a few other things — the highlights of the site, if you like — that I want to mention. Take a look at the map. Our present location is marked at the bottom. This year, we’ve identified the foundations of an ancient bridge, and it’s really exciting today because a team of divers are in the river searching for lost objects. To reach the bridge, take the main path ahead of you, go straight on, and keep going till the path bends to the left. You’ll see a smaller track leading off to the right. Follow that to take you to the river, where the divers are.<\/p><p class=\"ln\"><b>HAYDEN<\/b> You might be interested to see the rubbish pit. This is very near the castle walls in the north-west corner of the site. It actually dates to the time of the castle and not the ancient village. We found oyster shells and fish bones, and we assumed they were thrown from the castle kitchen above. One area we excavated in the first summer uncovered the site of a meeting hall. We knew it was an important building because it had two rows of post holes, deep enough to support a large roof. It is the largest structure in the central area of the site, next to the current excavation area.<\/p><p class=\"ln\"><b>HAYDEN<\/b> Last year we discovered a fish pond in the ancient village. Normally these were beside a river. The pond here is further away, but it’s possible the river has moved slightly. Anyway, to get there from here, you turn right at the first information board you come to and follow the path into the trees. Before you come out of the trees, you’ll see it on your right. If you reach the river, you’ve gone too far. So, does anyone have…<\/p>", "trtype": "full"}, {"id": "t11", "key": "Cambridge 20|Test 3 · Part 3", "group": "Cambridge 20", "label": "Test 3 · Part 3", "media": "Cambridge 20 — Test 3, Part 3", "offline": false, "tr": "<p class=\"ln\"><b>MAYA<\/b> So, Finn, I’ve done as much as I can for our project on theatre programmes. How’s your research coming along?<\/p><p class=\"ln\"><b>FINN<\/b> OK, Maya. I didn’t know theatre programmes are called playbills in the USA till I started looking into the topic. Even though I struggled to find many useful websites, I’m glad we picked this subject. No one else on the course is doing the same as us, although it is one of the research areas of the module convener.<\/p><p class=\"ln\"><b>MAYA<\/b> That might actually put some people off.<\/p><p class=\"ln\"><b>FINN<\/b> I suppose so. Anyway, I hadn’t realised there are actually companies specialising in creating theatre programmes.<\/p><p class=\"ln\"><b>MAYA<\/b> Yes, they are quite common nowadays. Contrary to what many people think, theatres don’t hire people to do the programmes. In fact, companies buy the rights to publish programmes on the theatre’s behalf and then make their money selling advertising space within the programme booklet.<\/p><p class=\"ln\"><b>FINN<\/b> It must be easier for theatres to do it that way.<\/p><p class=\"ln\"><b>MAYA<\/b> Yes.<\/p><p class=\"ln\"><b>FINN<\/b> I remember reading something about programmes in early British theatre. It said that the cast was always very important.<\/p><p class=\"ln\"><b>MAYA<\/b> Yeah, audiences were very familiar with leading actors and big names would draw huge crowds.<\/p><p class=\"ln\"><b>FINN<\/b> But I hadn’t realised that if the programme named a famous actor, that’s who the public expected to perform. And if that didn’t happen, people accused the theatre of breaking their agreement with the audience. They would demand refunds, and if they didn’t get them, there were riots.<\/p><p class=\"ln\"><b>MAYA<\/b> Outrageous! That’d never happen now.<\/p><p class=\"ln\"><b>FINN<\/b> No, people are too polite, even when they’re disappointed if the star of the show misses a performance.<\/p><p class=\"ln\"><b>MAYA<\/b> We should definitely include that information about early audiences in our project. I also think it’s important to mention that lots of ordinary people at that time were illiterate, so theatre programmes were of limited value in advertising plays. When a company of actors arrived in a town, they’d parade around the streets in their costumes, beating drums and announcing their upcoming performances.<\/p><p class=\"ln\"><b>FINN<\/b> Interesting. I couldn’t imagine that happening now either.<\/p><p class=\"ln\"><b>MAYA<\/b> There’s also an interesting comparison to make between 18th and 19th century programmes.<\/p><p class=\"ln\"><b>FINN<\/b> Wasn’t it in the 19th century that theatre programmes started to resemble programmes today?<\/p><p class=\"ln\"><b>MAYA<\/b> Yes, and unlike programmes from the 18th century, they always used colour.<\/p><p class=\"ln\"><b>FINN<\/b> And there was a greater variety of designs. But personally I think 18th century programmes were superior because they told the theatregoers so many things, including about the actors.<\/p><p class=\"ln\"><b>MAYA<\/b> And about the writer, the plot and sometimes the history of the play.<\/p><p class=\"ln\"><b>FINN<\/b> That’s right. What should we say about theatre programmes in the 20th century?<\/p><p class=\"ln\"><b>MAYA<\/b> I reckon the most important thing is the dramatic change they underwent during World War II.<\/p><p class=\"ln\"><b>FINN<\/b> When the government imposed restrictions on the use of paper.<\/p><p class=\"ln\"><b>MAYA<\/b> Yeah, but that was only in the UK. In the USA, programmes, or rather playbills, continued to be published in the same format.<\/p><p class=\"ln\"><b>FINN<\/b> While here in the UK, programmes became merely a single sheet of paper folded to create four pages for text.<\/p><p class=\"ln\"><b>MAYA<\/b> What I don’t really get is that after the war they didn’t go back to being more than one sheet or change in any way for over 25 years. I know there were paper shortages after the war, but only for five or ten years.<\/p><p class=\"ln\"><b>FINN<\/b> Strange.<\/p><p class=\"sys\">Before you hear the rest of the discussion, you have some time to look at questions 27 to 30. Now listen and answer questions 27 to 30.<\/p><p class=\"ln\"><b>MAYA<\/b> I got some pictures of programmes we could include on the slides for our presentation.<\/p><p class=\"ln\"><b>FINN<\/b> I found a couple too, Maya. Let’s go through and see what we think.<\/p><p class=\"ln\"><b>MAYA<\/b> Um, oh, this is an old one for a play called Ruy Blas.<\/p><p class=\"ln\"><b>FINN<\/b> Never heard of that. But the programme looks very decorative.<\/p><p class=\"ln\"><b>MAYA<\/b> Good enough to put in a frame on the wall. The images are just beautiful. Finn, what did you find?<\/p><p class=\"ln\"><b>FINN<\/b> I’ve got some pages from a programme for Man of La Mancha. I thought this was a good programme to show, not because of the pictures, but because it contains articles written by members of the theatre company, so we can learn how the production was created and the thoughts and feelings of the cast.<\/p><p class=\"ln\"><b>MAYA<\/b> Good. I’ve got a copy of a programme that’s now in a museum. It’s for The Tragedy of Jane Shore and it’s said to be the earliest surviving document to have been printed on Australia’s first printing press.<\/p><p class=\"ln\"><b>FINN<\/b> Fantastic!<\/p><p class=\"ln\"><b>MAYA<\/b> Another programme to talk about is for The Sailors’ Festival. It comes from the British Library’s digitised collection of programmes that was started a few years ago. It already comprises over 200,000 programmes, which is amazing!<\/p><p class=\"ln\"><b>FINN<\/b> Huh. Wish I’d known about it while I was doing my research.<\/p>", "trtype": "full"}, {"id": "t12", "key": "Cambridge 20|Test 3 · Part 4", "group": "Cambridge 20", "label": "Test 3 · Part 4", "media": "Cambridge 20 — Test 3, Part 4", "offline": false, "tr": "<p class=\"ln\"><b>SPEAKER<\/b> It’s only relatively recently that designers have become aware of the need to be inclusive when designing products. But what does that mean exactly? Well, it simply means designing products that span economic, social and cultural barriers. It means making sure products are accessible, so that as many different types of people as possible can use them, without any type of adaptation having to be made to the original design. Inclusive design is often linked with universal design, although they are not quite the same thing. Universal design aims to make products that work for everyone, and that includes considering the needs of people who have cognitive difficulties, which can present quite a challenge.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Today examples of successful inclusive design can be seen all around us. In workplaces it is common to see desks which can be adjusted to suit people of different heights or for wheelchair users. This still isn’t always the case, however, and is one reason why office workers often suffer from back or neck problems. You’ll find another example in the public toilets of countless hotels, airports and offices. Taps that you activate by sensor require no pressing or twisting movements. These are not only more hygienic, they’re also easier for people with dexterity or mobility issues.<\/p><p class=\"ln\"><b>SPEAKER<\/b> The tech industry has been criticised in the past for focusing too much on young consumers, but this is changing. Many products are now designed with the elderly in mind. For example, it’s well known that vision declines with age and that we also become worse at distinguishing between similar colours, in particular shades of blue, which is why software designers rarely create interfaces with this colour. Motor skills also decline with age and some people have difficulty doing everyday things like picking up a cup or opening a door. This can also affect their ability to use a mouse or keyboard. So voice access is now a routine way of making commands.<\/p><p class=\"ln\"><b>SPEAKER<\/b> It’s worth looking at the problems non-inclusive designs cause when not enough consideration is given to a range of users, as it can have a serious impact on people’s lives. Access is one obvious example because it has such a huge impact on disabled people’s independence. Not being able to access public transport because buses or trains are not wheelchair-friendly means many disabled people can’t go out unless someone goes with them. Safety is another issue. Inexplicably, most cars are still crash-tested using a dummy based on an average-sized male. This has safety implications for all women, particularly those who are pregnant, as the seatbelts worn by the dummy are not adapted to accommodate them.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Over the past 100 years, workplaces in the UK have, on the whole, become considerably safer. Employers are legally required to provide well-maintained personal protective equipment, or PPE — anything from goggles to full bodysuits — to workers who need it, free of charge. But most PPE is designed to fit men. A recent report found that employers often think that when it comes to female workers, all they need to do to comply with this legal requirement is to buy jackets, for example, designed for a small man. The problem with this is that women can be tall and still have much smaller shoulders than the average man. Ill-fitting PPE such as high-vis jackets, vests and body armour can put women at risk. The report found that 95% of women said that their PPE often hampered their work and that this problem was worst in the emergency services, particularly the police.<\/p><p class=\"ln\"><b>SPEAKER<\/b> Another problem is related to comfort at work. A very common scenario in offices in summertime is to see women wrapped in blankets or wearing sweaters while the air conditioning is on high. Meanwhile, the men are in shorts and T-shirts. This is due to differences in metabolic rates for men and women. There is a standard setting for air conditioning to be at a temperature of 21 degrees, designed to suit men, and in most modern offices it is not possible to turn the air conditioning up or down. This means that many offices which mainly employ women are wasting energy by having the air conditioning set too high. As you can see from the examples I’ve just mentioned, there are serious consequences for designs which don’t consider the needs of all users.<\/p>", "trtype": "full"}, {"id": "t13", "key": "Cambridge 20|Test 4 · Part 1", "group": "Cambridge 20", "label": "Test 4 · Part 1", "media": "Cambridge 20 — Test 4, Part 1", "offline": false, "tr": "<p class=\"ln\"><b>MAN<\/b> Sandra, I seem to remember you had some family visitors staying with you recently.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, that’s right. My brother and his family were here a couple of months ago.<\/p><p class=\"ln\"><b>MAN<\/b> OK, good. Well, I wanted to ask for your advice. I’ve got my cousin and her family visiting next month, and as I don’t have kids, I’ve no idea where to take them.<\/p><p class=\"ln\"><b>WOMAN<\/b> Right. What about accommodation? Are they going to stay with you in your flat?<\/p><p class=\"ln\"><b>MAN<\/b> No, thankfully. There wouldn’t be room. My cousin wants me to recommend a hotel. Do you know anywhere?<\/p><p class=\"ln\"><b>WOMAN<\/b> Yes, I do actually. I always recommend people stay at the King’s Hotel.<\/p><p class=\"ln\"><b>MAN<\/b> Where’s that near?<\/p><p class=\"ln\"><b>WOMAN<\/b> It’s about a five minutes’ walk from Murray Station, so nice and central. It’s actually on George Street.<\/p><p class=\"ln\"><b>MAN<\/b> Oh yes, I know.<\/p><p class=\"ln\"><b>WOMAN<\/b> I think they’re on quite a tight budget, so how much roughly is it to stay there? If you book a family room, it’s about £125 per night. My brother paid for two double rooms in the end, and I think that was around £95 for each room.<\/p><p class=\"ln\"><b>MAN<\/b> Oh, that’s not too bad. So how old are your cousin’s kids?<\/p><p class=\"ln\"><b>MAN<\/b> Twelve and nine. So I want to organise some trips while they’re here. I was thinking of doing a bus tour of the city centre, as none of them have been here before.<\/p><p class=\"ln\"><b>WOMAN<\/b> Those bus tours are quite expensive. I think it’s better to do a walking tour. It gives you a much better feel for the city. There’s one that starts from Carlton Square. It takes a couple of hours and doesn’t cost that much.<\/p><p class=\"ln\"><b>MAN<\/b> Sounds good. I’ll look that up. Thanks.<\/p><p class=\"ln\"><b>WOMAN<\/b> If the weather’s nice, one thing you could do is visit the old fort. You could get there by boat. The whole trip takes half a day.<\/p><p class=\"ln\"><b>MAN<\/b> That’s a really good idea. I’d like to do that myself. And if the weather’s bad I was thinking they could go to the science museum. But maybe they could do that when I’m at work.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, don’t forget it’s closed on Mondays.<\/p><p class=\"ln\"><b>MAN<\/b> They’re here from Saturday for four nights, so Tuesday would be best I think.<\/p><p class=\"ln\"><b>WOMAN<\/b> And it won’t be so crowded then. Saturdays are terrible. I took my kids to the exhibition on old computers there and it was far too crowded. I wanted to go back but it’s finished now.<\/p><p class=\"ln\"><b>MAN<\/b> That’s a shame. My cousin’s kids would have enjoyed that.<\/p><p class=\"ln\"><b>WOMAN<\/b> There’s another one starting soon on space, which looks really good too.<\/p><p class=\"ln\"><b>MAN<\/b> OK, well, I’ll mention that to my cousin.<\/p><p class=\"sys\">Before you hear the rest of the conversation, you have some time to look at questions 7 to 10. Now listen and answer questions 7 to 10.<\/p><p class=\"ln\"><b>WOMAN<\/b> Have you thought about where to take them to eat?<\/p><p class=\"ln\"><b>MAN<\/b> Well, I really like all the food stalls at Clacton Market. My cousin’s vegetarian. I know it’s one of the best places for that kind of food.<\/p><p class=\"ln\"><b>WOMAN<\/b> Definitely, and there’ll be loads of choices for the kids too. You need to get there quite early, though. At the weekend, most of the stores stop serving lunch at 2.30.<\/p><p class=\"ln\"><b>MAN<\/b> Good point. It’s all going to need careful planning. My cousin said she’d love to take the kids to a show at the theatre, but tickets are so expensive.<\/p><p class=\"ln\"><b>WOMAN<\/b> I know. But you can get some good deals if you book online with bargaintickets for the following day. On some seats there’s a 75% discount.<\/p><p class=\"ln\"><b>MAN<\/b> Really? I must try and get some.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah. There are lots of things you can do for free as well. No need to spend a fortune.<\/p><p class=\"ln\"><b>MAN<\/b> Like what?<\/p><p class=\"ln\"><b>WOMAN<\/b> They’re coming next month, right? Well, check and see if it’s the same weekend as the Roots Music Festival in Blakewell Gardens.<\/p><p class=\"ln\"><b>MAN<\/b> R-O-O-T-S?<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, check it out online. It’s always a family-friendly event and there’s no entry charge.<\/p><p class=\"ln\"><b>MAN<\/b> That sounds perfect.<\/p><p class=\"ln\"><b>WOMAN<\/b> And if you’re in Blakewell Gardens, climb Telegraph Hill. You’ll be able to look right down on the port. Everyone’s always really impressed because it’s so huge.<\/p><p class=\"ln\"><b>MAN<\/b> Oh yeah, I’ve been meaning to do that for ages. I’ve heard the view’s amazing.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, it’s really worth the effort.<\/p><p class=\"ln\"><b>MAN<\/b> Well, that’s given me loads of ideas. Thanks so much.<\/p>", "trtype": "full"}, {"id": "t14", "key": "Cambridge 20|Test 4 · Part 2", "group": "Cambridge 20", "label": "Test 4 · Part 2", "media": "Cambridge 20 — Test 4, Part 2", "offline": false, "tr": "<p class=\"ln\"><b>GUIDE<\/b> Good morning and welcome to City Football Club. I’d like to give you some useful information about your visit to the stadium today, and then we’ll start the tour of the areas of the stadium that are open to visitors. I can see lots of children here today, so just to let mums and dads know a few things before we start. The stadium has lots of stairs and the players’ tunnel is very dark. Please don’t let your children wander off on their own, even for a minute. We don’t want any accidents or anyone getting frightened. Cameras are permitted everywhere and you can take pictures of your child shooting a penalty. Assistants are helping to organise this and hopefully the queue won’t be too long.<\/p><p class=\"ln\"><b>GUIDE<\/b> It’s very hot and sunny out on the pitch today. You can get food and drink at the café and I really recommend the healthy lunch boxes for children. Also in the café, children are invited to do a football drawing. We pick the best one at the end of the afternoon, so don’t forget to put your name and contact details on the back. That way, if you’ve left the stadium before then, we’ll send your prize, but sadly we can’t return drawings.<\/p><p class=\"ln\"><b>GUIDE<\/b> I’d like to mention some features of the tour. We’ll start with the 360 cinema experience, which has been very popular over the years, and then I’ll take you to the players’ dressing rooms, before going outside to the seating area and the pitch. I should say, if you’d prefer your visit to be self-guided, please collect headphones from the reception, and then you can listen to the pre-recorded information at your own speed. We’ve only just introduced this feature and would appreciate your feedback. We’re thinking of offering tours in other languages in future, so if you have any thoughts on that, we’d welcome those too. If you plan to return another time, you might like to book one of our VIP tours. We’ve only just started offering these and they can be booked online.<\/p><p class=\"sys\">Now listen and answer questions 15 to 20.<\/p><p class=\"ln\"><b>GUIDE<\/b> Now, the stadium you see today was built in 1989 as part of a three-year redevelopment project. While that project was going on, the team had to play its matches at the ground of another club. Apart from that, the club has been here on this site since 1870. As some of you may know, that was the start of a really important decade in the history of football in this country. For example, 1870 was also the year that football teams started to include a player whose role it was to guard the goal. It’s hard to imagine what the game must have been like without someone in that position, isn’t it?<\/p><p class=\"ln\"><b>GUIDE<\/b> In 1872 and 73, many other clubs were established, both here and abroad. And the following year, in 1874, referees were allowed to send players off if they committed certain offences, and also in that year teams started having to swap ends at half-time. One fact I was interested to discover was that in early football games the aim was for the scorer to get the ball between two flag posts, and later between sticks joined at the top with a piece of tape. In 1875, that tape was replaced with the solid crossbar that we’re familiar with today.<\/p><p class=\"ln\"><b>GUIDE<\/b> 1877 saw the founding of further new clubs, and the history books tell us that in the same year all the clubs decided to set a limit of 90 minutes for each match. Before that it was a more casual arrangement, and this sometimes caused huge arguments and sometimes fights during matches when one team called the end of the game and the other team wanted to play on to try and score a winning goal. By 1878, the number of teams in the Football League increased again. In addition, referees started using whistles and electric lamps were installed on certain pitches. This was a significant change, as games could then be played in the evenings all year round. In 1880, clubs began to charge fans for admission to games, even though players were still amateurs and had other proper jobs. That’s hard to imagine in the modern professional game, where top players earn significant sums of money.<\/p>", "trtype": "full"}, {"id": "t15", "key": "Cambridge 20|Test 4 · Part 3", "group": "Cambridge 20", "label": "Test 4 · Part 3", "media": "Cambridge 20 — Test 4, Part 3", "offline": false, "tr": "<p class=\"ln\"><b>MAN<\/b> How are you getting on with the assignment on handwriting?<\/p><p class=\"ln\"><b>WOMAN<\/b> Not too bad. You know, I hadn’t realised that children benefit in so many ways from learning to write. It’s such an important skill, and yet most people think handwriting is less important than in the past, because people hardly ever write by hand these days.<\/p><p class=\"ln\"><b>MAN<\/b> Yes, and all the evidence suggests children should learn to write by hand before they learn to type, not least because it helps their memory.<\/p><p class=\"ln\"><b>WOMAN<\/b> That’s right. The physical act of writing helps children to remember letters. That seems pretty obvious when you think about it.<\/p><p class=\"ln\"><b>MAN<\/b> What’s less obvious is how it helps develop their concentration. They have to sit still and focus on one thing.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, that aspect of handwriting had never occurred to me before.<\/p><p class=\"ln\"><b>MAN<\/b> Same here. I’m not sure I understand how it improves children’s imagination, though.<\/p><p class=\"ln\"><b>WOMAN<\/b> Well, there was that study which showed that primary age children generated more ideas when they were writing by hand than using a keyboard. I would have guessed that would be the case.<\/p><p class=\"ln\"><b>MAN<\/b> Hmm, yeah. I never associated spatial awareness with handwriting either. I thought spatial awareness was more to do with knowing where you are in relation to objects or other people.<\/p><p class=\"ln\"><b>WOMAN<\/b> I thought that too. But good spatial awareness is essential for writing because you have to space words correctly. It’s not just fine motor skills that improve through writing, as I’d always assumed.<\/p><p class=\"ln\"><b>MAN<\/b> Handwriting is so much harder for children with dyspraxia, who have problems coordinating movement. It’s good there are lots of things you can do in the classroom to help them. They need so much more support with letter formation. You need to play lots of games to help them distinguish letter shapes. It takes a lot of patience.<\/p><p class=\"ln\"><b>WOMAN<\/b> Yeah, I like the idea of using one of those pens that lights up if you press too hard. That seems l
