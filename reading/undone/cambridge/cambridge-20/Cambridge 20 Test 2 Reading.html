        "<strong>A</strong>&nbsp;&nbsp;Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead. We all do it from time to time. We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it. Unfortunately, berating ourselves won't stop us procrastinating again. In fact, it's one of the worst things we can do. This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.",

function accepts(q, val){
  const list = Array.isArray(q.answer) ? q.answer : [q.answer];
  return list.some(a => norm(a) === norm(val));
}
let currentPart = 1;

function passageHtml(p){
  let h = `<h3 class="text-xl font-bold mb-1">Reading Passage ${p.part}</h3>`;
  h += `<div class="text-lg font-bold mt-3">${p.title}</div>`;
  if(p.subtitle) h += `<div class="italic text-gray-600 mb-3">${p.subtitle}</div>`;
  h += p.body.map(t=>`<p>${t}</p>`).join('');
  return h;
}
function choiceControl(q, options, inline){
  const cls = inline ? "flex flex-wrap gap-2" : "flex flex-col gap-1.5";
  return `<div class="${cls} ui mt-2" data-qwrap="${q.id}">` + options.map(o=>`
    <label class="opt inline-flex items-center gap-2 border rounded px-2 py-1 text-sm hover:bg-gray-50">
      <input type="radio" name="q${q.id}" value="${o}"> <span>${o}</span></label>`).join('') + `</div>`;
}
function mcControl(q){
  return `<div class="flex flex-col gap-1.5 ui mt-2" data-qwrap="${q.id}">` + q.options.map(([v,label])=>`
    <label class="opt flex items-start gap-2 border rounded px-2 py-1.5 text-sm hover:bg-gray-50">
      <input type="radio" name="q${q.id}" value="${v}" class="mt-0.5"> <span><strong>${v}</strong>&nbsp; ${label}</span></label>`).join('') + `</div>`;
}
function inputControl(q){ return `<input class="blank-input ui" data-input="${q.id}" autocomplete="off" spellcheck="false">`; }
function selectControl(id, opts){
  return `<select class="blank-select ui" data-input="${id}"><option value=""></option>`+
    opts.map(([v,label])=>`<option value="${v}">${label}</option>`).join('')+`</select>`;
}

function renderQuestions(part){
  const wrap = document.getElementById('questions');
  wrap.innerHTML = '';
  TEST.groups.filter(g=>g.part===part).forEach(g=>{
    const sec = document.createElement('div');
    sec.className = 'mb-8';
    let html = `<h3 class="ui font-bold text-lg mb-1">${g.heading}</h3>`;
    html += `<p class="ui text-sm text-gray-700 mb-3">${g.rubric}</p>`;
    if(g.type==='template'){
      let t = g.template;
      g.questions.forEach(q=>{
        const ctrl = g.selectOptions ? selectControl(q.id, g.selectOptions) : inputControl(q);
        t = t.replace(`[[${q.id}]]`, `<span class="num mr-1">${q.id}</span>${ctrl}`);
      });
      html += `<div class="ui text-sm bg-gray-50 border rounded p-3 leading-8">${t}</div>`;
    } else if(g.type==='multi'){
      html += `<div class="ui text-sm font-semibold mb-2">${g.prompt}</div>`;
      html += `<div data-multiwrap="${g.key}" class="flex flex-col gap-1.5 ui">`+ g.options.map(([v,label])=>`
        <label class="opt flex items-start gap-2 border rounded px-2 py-1.5 text-sm hover:bg-gray-50">
          <input type="checkbox" data-multi="${g.key}" value="${v}" class="mt-0.5"> <span><strong>${v}</strong>&nbsp; ${label}</span></label>`).join('') + `</div>`;
    } else {
      g.questions.forEach(q=>{
        html += `<div class="mb-4"><div class="flex gap-2"><span class="num mt-0.5">${q.id}</span><div class="ui text-sm flex-1">${q.prompt||''}`;
        if(g.type==='mc') html += mcControl(q);
        else if(g.type==='choice') html += choiceControl(q, g.options, g.inline);
        html += `</div></div></div>`;
      });
    }
    sec.innerHTML = html;
    wrap.appendChild(sec);
  });
  // restore
  wrap.querySelectorAll('input[type=radio]').forEach(r=>{ if(answers[r.name.slice(1)]===r.value) r.checked=true; });
  wrap.querySelectorAll('input[data-input], select[data-input]').forEach(i=>{
    const id=i.getAttribute('data-input'); if(answers[id]!=null) i.value=answers[id];
  });
  wrap.querySelectorAll('input[data-multi]').forEach(c=>{
    const arr=answers[c.getAttribute('data-multi')]||[]; if(arr.includes(c.value)) c.checked=true;
  });
  // listeners
  wrap.querySelectorAll('input[type=radio]').forEach(r=> r.addEventListener('change', ()=>{ answers[r.name.slice(1)]=r.value; }));
  wrap.querySelectorAll('input[data-input], select[data-input]').forEach(i=> i.addEventListener('input', ()=>{ answers[i.getAttribute('data-input')]=i.value; }));
  wrap.querySelectorAll('input[data-multi]').forEach(c=> c.addEventListener('change', ()=>{
    const key=c.getAttribute('data-multi');
    const g=TEST.groups.find(x=>x.key===key);
    let arr=answers[key]||[];
    if(c.checked){
      if(arr.length>=g.pick){ c.checked=false; return; }
      arr=[...arr, c.value];
    } else arr=arr.filter(v=>v!==c.value);
    answers[key]=arr;
  }));
}

function renderPart(part){
  currentPart = part;
  const p = TEST.passages.find(x=>x.part===part);
  document.getElementById('instructions').innerHTML = p.instructions;
  document.getElementById('passage').innerHTML = passageHtml(p);
  renderQuestions(part);
  document.querySelectorAll('.part-tab').forEach(b=>{
    const on = +b.dataset.part===part;
    b.classList.toggle('bg-red-600', on); b.classList.toggle('text-white', on);
    b.classList.toggle('border-red-600', on); b.classList.toggle('bg-white', !on);
  });
  document.querySelector('main section:first-child').scrollTop = 0;
  document.querySelector('main section:last-child').scrollTop = 0;
}

function scoreAll(){
  let correct=0;
  TEST.groups.forEach(g=>{
    if(g.type==='multi'){
      const sel=answers[g.key]||[];
      correct += sel.filter(x=>g.answer.includes(x)).length;
    } else {
      g.questions.forEach(q=>{ const v=answers[q.id]; if(v!=null&&v!==''&&accepts(q,v)) correct++; });
    }
  });
  return correct;
}
function check(){
  const correct = scoreAll();
  markCurrentPart();
  const box=document.getElementById('scoreBox');
  box.classList.remove('hidden');
  box.textContent=`Score: ${correct} / 40`;
  box.className='ml-auto text-sm font-bold '+(correct>=30?'text-green-700':correct>=20?'text-yellow-700':'text-red-700');
}
function markCurrentPart(){
  const wrap=document.getElementById('questions');
  TEST.groups.filter(g=>g.part===currentPart).forEach(g=>{
    if(g.type==='multi'){
      const sel=answers[g.key]||[];
      wrap.querySelectorAll(`[data-multiwrap="${g.key}"] label`).forEach(l=>{
        const v=l.querySelector('input').value; l.classList.remove('correct','incorrect');
        if(g.answer.includes(v)) l.classList.add('correct');
        else if(sel.includes(v)) l.classList.add('incorrect');
      });
      return;
    }
    g.questions.forEach(q=>{
      const val=answers[q.id]; const ok=val!=null&&val!==''&&accepts(q,val);
      if(g.type==='template'){
        const inp=wrap.querySelector(`[data-input="${q.id}"]`);
        if(inp){ inp.classList.remove('correct','incorrect'); inp.classList.add(ok?'correct':'incorrect');
          const old=inp.parentElement.querySelector('.ans-tag'); if(old) old.remove();
          if(!ok){ const tag=document.createElement('span'); tag.className='ans-tag ui text-xs text-green-700 font-semibold ml-1';
            tag.textContent='✓ '+(Array.isArray(q.answer)?q.answer[0]:q.answer); inp.after(tag); } }
      } else {
        const box=wrap.querySelector(`[data-qwrap="${q.id}"]`);
        if(box) box.querySelectorAll('label').forEach(l=>{
          const v=l.querySelector('input').value; l.classList.remove('correct','incorrect');
          if(v===String(q.answer)) l.classList.add('correct');
          if(v===val && !ok) l.classList.add('incorrect');
        });
      }
    });
  });
}
function reset(){ for(const k in answers) delete answers[k]; document.getElementById('scoreBox').classList.add('hidden'); renderPart(currentPart); }

let timerInt=null, remaining=3600;
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
document.getElementById('timerBtn').addEventListener('click', e=>{
  if(timerInt){ clearInterval(timerInt); timerInt=null; e.target.textContent='Start'; }
  else { e.target.textContent='Pause'; timerInt=setInterval(()=>{ if(remaining>0){remaining--; document.getElementById('timer').textContent=fmt(remaining);} },1000); }
});
document.querySelectorAll('.part-tab').forEach(b=> b.addEventListener('click', ()=>renderPart(+b.dataset.part)));
document.getElementById('checkBtn').addEventListener('click', check);
document.getElementById('resetBtn').addEventListener('click', reset);
renderPart(1);
</script>
</body>
</html>
