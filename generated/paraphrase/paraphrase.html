<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1e6de6"/>
<title>Paraphrase Practice — English Vault</title>
<style>
  :root{
    --bg:#f5f8fd;--card:#fff;--ink:#0f172a;--ink2:#475569;--ink3:#8a94a6;
    --line:#e6eaf1;--line2:#eef2f8;--soft:#eff4fb;
    --blue:#1e6de6;--blue2:#3b82f6;--blued:#0f2f66;--bluebg:#eff6ff;
    --green:#16a34a;--greenbg:#effdf4;--amber:#b45309;--amberbg:#fff7ed;
    --red:#dc2626;--redbg:#fef2f2;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .wrap{max-width:720px;margin:0 auto;padding:22px 20px}
  .hero{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff;border-radius:20px;
    padding:18px 24px 24px;box-shadow:0 14px 36px rgba(30,109,230,.24);margin-bottom:18px}
  .nav{display:flex;gap:6px;margin:0 -4px 12px}
  .nav a{font-size:13px;font-weight:600;color:#dbeafe;text-decoration:none;padding:7px 13px;border-radius:999px;transition:.12s}
  .nav a:hover{background:rgba(255,255,255,.16);color:#fff}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe}
  h1{font-weight:800;font-size:26px;margin:8px 0 6px;letter-spacing:-.02em;color:#fff}
  .lede{color:#dbeafe;font-size:14px;margin:0}
  .lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 2px 8px}
  .switch{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);gap:2px;margin-bottom:14px}
  .switch button{border:none;background:none;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
  .switch button[aria-pressed="true"]{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff}
  .switch button:disabled{opacity:.45;cursor:default}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink3);margin:6px 2px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .srcrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .badge.reading{background:var(--bluebg);color:var(--blue)}
  .badge.listening{background:var(--amberbg);color:var(--amber)}
  .qno{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .side{margin:0 0 4px}
  .side .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
  .phrase{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:2px 0 0}
  .phrase.p{color:var(--blue)}
  .phrase.q{color:var(--blued)}
  .arrow{color:var(--ink3);font-size:18px;text-align:center;margin:10px 0 6px}
  .ctx{font-size:14px;color:var(--ink2);line-height:1.6;border-left:2px solid var(--line);padding-left:11px;margin-top:8px}
  .ctx b{background:#fff3c4;color:var(--ink);font-weight:700;border-radius:3px;padding:0 2px}
  .uz{font-size:14px;color:var(--green);margin-top:10px;font-weight:600}
  .btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;
    padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
  .btn.primary{background:linear-gradient(135deg,#0f2f66,#1e6de6);color:#fff;border:none}
  .row2{display:flex;gap:8px;margin-top:12px}
  .hidden{display:none!important}
  .prog{height:4px;background:var(--line2);border-radius:999px;overflow:hidden;margin:0 2px 14px}
  .prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
  /* match game */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cols .colhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 2px 4px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;
    font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left;width:100%;color:var(--ink);line-height:1.4;transition:.12s}
  .tile:hover{border-color:var(--blue2)}
  .tile.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,109,230,.14)}
  .tile.ok{background:var(--greenbg);border-color:#bbf7d0;color:var(--green);cursor:default}
  .tile.bad{background:var(--redbg);border-color:#fecaca;color:var(--red)}
  .empty{color:var(--ink2);padding:40px 4px;text-align:center}
  .hint{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:-6px 2px 16px}
</style>

<body>
<div class="wrap">
  <div class="hero">

  <div id="empty" class="empty hidden">No pairs yet — collect some with the paraphrase-bank skill.</div>
</div>
<script>
const DATA = [{"q": "inability to fly", "p": "flightless", "qno": "1", "qtext": "There are other parrots that share the kākāpō's inability to fly.", "ptext": "It is the world's only flightless parrot.", "test": "C20-r1", "type": "reading"}, {"q": "produce chicks", "p": "breed", "qno": "2", "qtext": "Adult kākāpō produce chicks every year.", "ptext": "They breed, but only in years when food is plentiful.", "test": "C20-r1", "type": "reading"}, {"q": "bring food back to nesting females", "p": "play no part in incubation or chick-rearing", "qno": "3", "qtext": "Adult male kākāpō bring food back to nesting females.", "ptext": "Males play no part in incubation or chick-rearing – females alone incubate eggs and feed the chicks.", "test": "C20-r1", "type": "reading"}, {"q": "were at risk from feral cats", "p": "predation by feral cats led to a rapid decline", "qno": "5", "qtext": "Kākāpō were transferred from Rakiura Island to other locations because they were at risk from feral cats.", "ptext": "predation by feral cats on Rakiura Island led to a rapid decline", "test": "C20-r1", "type": "reading"}, {"q": "were transferred to other locations", "p": "was evacuated to three island sanctuaries", "qno": "5", "qtext": "Kākāpō were transferred from Rakiura Island to other locations because they were at risk from feral cats.", "ptext": "the surviving population was evacuated to three island sanctuaries", "test": "C20-r1", "type": "reading"}, {"q": "caring for struggling young birds", "p": "rescuing and hand-raising any failing chicks", "qno": "6", "qtext": "One Recovery Plan initiative that helped increase the kākāpō population size was caring for struggling young birds.", "ptext": "The Recovery Plan involved rescuing and hand-raising any failing chicks.", "test": "C20-r1", "type": "reading"}, {"q": "various parts of a tree", "p": "the leaves, roots and bark of trees", "qno": "7", "qtext": "Diet consists of fern fronds, various parts of a tree and bulbs", "ptext": "the leaves, roots and bark of trees as well as bulbs, and fern fronds", "test": "C20-r1", "type": "reading"}, {"q": "Nests are created in", "p": "eggs are laid in", "qno": "8", "qtext": "Nests are created in soil where eggs are laid.", "ptext": "The 1–4 eggs are laid in soil.", "test": "C20-r1", "type": "reading"}, {"q": "used to make clothes", "p": "used its feathers to make soft cloaks", "qno": "9", "qtext": "The feathers of the kākāpō were used to make clothes.", "ptext": "They ate its meat and used its feathers to make soft cloaks.", "test": "C20-r1", "type": "reading"}, {"q": "an animal which they introduced", "p": "introduced species such as deer", "qno": "10", "qtext": "Deer were an animal which they introduced that ate the kākāpō's food sources.", "ptext": "introduced species such as deer depleted the remaining forests of food", "test": "C20-r1", "type": "reading"}, {"q": "ate the kākāpō's food sources", "p": "depleted the remaining forests of food", "qno": "10", "qtext": "Deer were an animal which they introduced that ate the kākāpō's food sources.", "ptext": "introduced species such as deer depleted the remaining forests of food", "test": "C20-r1", "type": "reading"}, {"q": "A definite sighting was reported", "p": "it was confirmed females were also present", "qno": "11", "qtext": "A definite sighting of female kākāpō on Rakiura Island was reported in the year 1980", "ptext": "in 1980 it was confirmed females were also present", "test": "C20-r1", "type": "reading"}, {"q": "an increase in funding", "p": "a higher amount of funding", "qno": "12", "qtext": "The Recovery Plan included an increase in funding", "ptext": "together with a higher amount of funding", "test": "C20-r1", "type": "reading"}, {"q": "maintain the involvement of", "p": "continue to be fully engaged", "qno": "13", "qtext": "A current goal of the Recovery Plan is to maintain the involvement of stakeholders in kākāpō protection.", "ptext": "ensure stakeholders continue to be fully engaged", "test": "C20-r1", "type": "reading"}, {"q": "only a few surviving large elms", "p": "the number of these mature survivors is relatively small", "qno": "14", "qtext": "reference to the research problems that arise from there being only a few surviving large elms", "ptext": "opportunities are limited as the number of these mature survivors is relatively small", "test": "C20-r1", "type": "reading"}, {"q": "a difference of opinion", "p": "disagree about", "qno": "15", "qtext": "details of a difference of opinion about the value of reintroducing elms to Britain", "ptext": "Russell and Elliot disagree about the value of reintroducing elms.", "test": "C20-r1", "type": "reading"}, {"q": "was brought into Britain", "p": "was triggered by shipments of elm from Canada", "qno": "16", "qtext": "reference to how Dutch elm disease was brought into Britain", "ptext": "the second epidemic was triggered by shipments of elm from Canada", "test": "C20-r1", "type": "reading"}, {"q": "conditions that have enabled a location to escape the disease", "p": "strong sea winds make it hard for the beetle to attack", "qno": "17", "qtext": "a description of the conditions that have enabled a location in Britain to escape Dutch elm disease", "ptext": "Brighton's strong sea winds make it hard for the beetle to attack.", "test": "C20-r1", "type": "reading"}, {"q": "the stage at which young elms become vulnerable", "p": "it becomes a perfect size for beetles", "qno": "18", "qtext": "reference to the stage at which young elms become vulnerable to Dutch elm disease", "ptext": "once the trunk reaches 10–15 centimetres it becomes a perfect size for beetles", "test": "C20-r1", "type": "reading"}, {"q": "the damage rapidly becomes visible", "p": "The effects are very quick — those that are susceptible show leaf loss", "qno": "19", "qtext": "If a tree gets infected with Dutch elm disease, the damage rapidly becomes visible.", "ptext": "The effects are very quick... those that are susceptible show leaf loss.", "test": "C20-r1", "type": "reading"}, {"q": "It may be better to wait and see", "p": "give nature time to recover", "qno": "20", "qtext": "It may be better to wait and see if the mature elms that have survived continue to flourish.", "ptext": "give nature time to recover ... over time, you might get resistance", "test": "C20-r1", "type": "reading"}, {"q": "There must be an explanation", "p": "I don't see how it can be entirely down to luck", "qno": "21", "qtext": "There must be an explanation for the survival of some mature elms.", "ptext": "I don't see how it can be entirely down to luck.", "test": "C20-r1", "type": "reading"}, {"q": "are not very far away", "p": "right on our doorstep", "qno": "22", "qtext": "We need to be aware that insects carrying Dutch elm disease are not very far away.", "ptext": "The beetles can just march in... the threat is right on our doorstep.", "test": "C20-r1", "type": "reading"}, {"q": "evidence of how prominent the tree once was", "p": "old photographs", "qno": "23", "qtext": "You understand the effect Dutch elm disease has had when you see evidence of how prominent the tree once was.", "ptext": "you realise the impact when you see old photographs of how prominent elms were", "test": "C20-r1", "type": "reading"}, {"q": "the only tree that was more popular than elm", "p": "elm ran a close second to oak", "qno": "24", "qtext": "the only tree that was more popular in Britain than elm was oak", "ptext": "elm ran a close second to oak as the hardwood tree of choice", "test": "C20-r1", "type": "reading"}, {"q": "wood for boxes", "p": "storage crates", "qno": "25", "qtext": "it was grown to provide wood for boxes and flooring", "ptext": "its wood was used for items such as storage crates and flooring", "test": "C20-r1", "type": "reading"}, {"q": "took little notice of bad news", "p": "they will ignore bad news", "qno": "31", "qtext": "At times when they were relaxed, the firefighters usually took little notice of bad news.", "ptext": "When relaxed, they will ignore bad news.", "test": "C20-r1", "type": "reading"}, {"q": "became more sensitive to bad news", "p": "became hyper-vigilant to bad news", "qno": "32", "qtext": "The researchers noted that when the firefighters were stressed, they became more sensitive to bad news.", "ptext": "they became hyper-vigilant to bad news... and altered their beliefs", "test": "C20-r1", "type": "reading"}, {"q": "reflects the nature of the posts in our feeds", "p": "if we observe negative posts, we will in turn create more negative posts", "qno": "36", "qtext": "The tone of the content we post on social media tends to reflect the nature of the posts in our feeds.", "ptext": "If we observe negative posts... we will in turn create more negative posts.", "test": "C20-r1", "type": "reading"}, {"q": "take unnecessary precautions", "p": "trips are cancelled, even if the disaster took place across the globe", "qno": "39", "qtext": "Stress created by social media posts can lead us to take unnecessary precautions.", "ptext": "trips are cancelled, even if the disaster took place across the globe", "test": "C20-r1", "type": "reading"}, {"q": "our tendency to be affected by other people's moods", "p": "positive emotions, such as hope, are contagious", "qno": "40", "qtext": "Our tendency to be affected by other people's moods can be used in a positive way.", "ptext": "positive emotions, such as hope, are contagious too, and are powerful in inducing people to act", "test": "C20-r1", "type": "reading"}];
</script>
<script>

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const view = document.getElementById('view');
const countEl = document.getElementById('count');
const progEl = document.getElementById('prog').firstElementChild;
const emptyEl = document.getElementById('empty');

let mode = 'cards', test = 'all', dir = 'p2q';
let order = [], at = 0, shown = false;

/* ---- highlight the phrase inside its sentence ---- */
function mark(sentence, phrase) {
  if (!sentence) return '';
  const s = esc(sentence), needle = esc(phrase);
  const hit = (hay, what) => hay.toLowerCase().indexOf(what.toLowerCase());
  let i = hit(s, needle), len = needle.length;
  if (i < 0) {
    // the phrase is often quoted with an ellipsis ("we observe ... we create"),
    // so fall back to its first few words rather than showing no highlight
    const words = needle.split(/\s+/);
    for (let n = Math.min(5, words.length); n >= 2 && i < 0; n--) {
      const head = words.slice(0, n).join(' ');
      i = hit(s, head); len = head.length;
    }
  }
  if (i < 0) return s;
  return s.slice(0, i) + '<b>' + s.slice(i, i + len) + '</b>' + s.slice(i + len);
}

function pool() { return test === 'all' ? DATA : DATA.filter(d => d.test === test); }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---- the test filter is built from the data ---- */
(function buildTestSwitch() {
  const wrap = document.getElementById('testSwitch');
  const tests = [...new Set(DATA.map(d => d.test))].sort();
  const mk = (val, label) => {
    const b = document.createElement('button');
    b.dataset.test = val; b.textContent = label;
    b.setAttribute('aria-pressed', String(val === 'all'));
    b.onclick = () => { test = val; [...wrap.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.test === val))); reset(); };
    wrap.appendChild(b);
  };
  mk('all', 'All');
  tests.forEach(t => mk(t, t));
})();

document.getElementById('modeSwitch').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  [...b.parentElement.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  reset();
});
document.getElementById('dirSwitch').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  dir = b.dataset.dir;
  [...b.parentElement.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  reset();
});

function reset() {
  const n = pool().length;
  emptyEl.classList.toggle('hidden', n > 0);
  document.getElementById('dirLab').classList.toggle('hidden', mode !== 'cards');
  document.getElementById('dirSwitch').classList.toggle('hidden', mode !== 'cards');
  document.getElementById('prog').classList.toggle('hidden', mode !== 'cards');
  order = shuffle(pool().slice()); at = 0; shown = false;
  render();
}

/* ---------------------------------------------------------------- cards */
function frontSide(d) {
  if (dir === 'q2p') return 'q';
  if (dir === 'p2q') return 'p';
  return (d.qno && Number(d.qno) % 2) ? 'q' : 'p';
}

function cardHtml(d) {
  const f = frontSide(d), b = f === 'q' ? 'p' : 'q';
  const label = { q: 'The question said', p: 'The passage said' };
  const ctx = { q: d.qtext, p: d.ptext };
  return `<div class="card">
    <div class="srcrow"><span class="badge ${esc(d.type)}">${esc(d.test)}</span>
      ${d.qno ? `<span class="qno">Q${esc(d.qno)}</span>` : ''}</div>
    <div class="side"><div class="tag">${label[f]}</div><div class="phrase ${f}">${esc(d[f])}</div></div>
    ${ctx[f] ? `<div class="ctx">${mark(ctx[f], d[f])}</div>` : ''}
    <div class="arrow">↓</div>
    ${shown ? `<div class="side"><div class="tag">${label[b]}</div><div class="phrase ${b}">${esc(d[b])}</div></div>
        ${ctx[b] ? `<div class="ctx">${mark(ctx[b], d[b])}</div>` : ''}
        ${d.uz ? `<div class="uz">${esc(d.uz)}</div>` : ''}`
      : `<div class="side"><div class="phrase" style="color:var(--ink3)">· · ·</div></div>`}
    <div class="row2">
      ${shown ? `<button class="btn primary" id="next">Next →</button>`
              : `<button class="btn primary" id="reveal">Show the other wording</button>`}
    </div>
  </div>`;
}

function renderCards() {
  if (!order.length) { view.innerHTML = ''; countEl.textContent = ''; progEl.style.width = '0'; return; }
  if (at >= order.length) {
    view.innerHTML = `<div class="card" style="text-align:center">
      <div class="phrase">Done — ${order.length} pairs</div>
      <div class="row2"><button class="btn primary" id="again">Go again</button></div></div>`;
    countEl.textContent = '';
    progEl.style.width = '100%';
    document.getElementById('again').onclick = reset;
    return;
  }
  view.innerHTML = cardHtml(order[at]);
  countEl.textContent = `${at + 1} / ${order.length}`;
  progEl.style.width = ((at) / order.length * 100) + '%';
  const rev = document.getElementById('reveal'), nxt = document.getElementById('next');
  if (rev) rev.onclick = () => { shown = true; renderCards(); };
  if (nxt) nxt.onclick = () => { at++; shown = false; renderCards(); };
}

document.addEventListener('keydown', e => {
  if (mode !== 'cards') return;
  const t = e.target;
  if (t && t.closest && t.closest('input,textarea,[contenteditable]')) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (!shown) { shown = true; } else { at++; shown = false; }
    renderCards();
  }
});

/* ---------------------------------------------------------------- match */
const ROUND = 5;
let matchSel = null, matchLeft = [];

function renderMatch() {
  const all = pool();
  if (!all.length) { view.innerHTML = ''; countEl.textContent = ''; return; }
  if (!matchLeft.length) matchLeft = shuffle(all.slice());
  const round = matchLeft.slice(0, ROUND);
  const left = round.map((d, i) => ({ d, i }));
  const right = shuffle(round.map((d, i) => ({ d, i })));
  countEl.textContent = `${matchLeft.length} left · tap a question wording, then its passage wording`;
  view.innerHTML = `<div class="cols">
    <div><div class="colhead">Question wording</div>
      ${left.map(x => `<button class="tile" data-side="q" data-i="${x.i}">${esc(x.d.q)}</button>`).join('')}</div>
    <div><div class="colhead">Passage wording</div>
      ${right.map(x => `<button class="tile" data-side="p" data-i="${x.i}">${esc(x.d.p)}</button>`).join('')}</div>
  </div>
  <div class="row2"><button class="btn" id="skipRound">New set →</button></div>`;

  document.getElementById('skipRound').onclick = () => { matchLeft = matchLeft.slice(ROUND); matchSel = null; renderMatch(); };

  let solved = 0;
  view.querySelectorAll('.tile').forEach(tile => {
    tile.onclick = () => {
      if (tile.classList.contains('ok')) return;
      if (!matchSel) { matchSel = tile; tile.classList.add('sel'); return; }
      if (matchSel === tile) { tile.classList.remove('sel'); matchSel = null; return; }
      if (matchSel.dataset.side === tile.dataset.side) {
        matchSel.classList.remove('sel'); matchSel = tile; tile.classList.add('sel'); return;
      }
      const hit = matchSel.dataset.i === tile.dataset.i;
      const a = matchSel; matchSel = null; a.classList.remove('sel');
      if (hit) {
        a.classList.add('ok'); tile.classList.add('ok');
        if (++solved >= round.length) {
          setTimeout(() => { matchLeft = matchLeft.slice(ROUND); renderMatch(); }, 650);
        }
      } else {
        a.classList.add('bad'); tile.classList.add('bad');
        setTimeout(() => { a.classList.remove('bad'); tile.classList.remove('bad'); }, 420);
      }
    };
  });
}

/* --------------------------------------------------------------- browse */
function renderBrowse() {
  const all = pool();
  countEl.textContent = `${all.length} pair${all.length === 1 ? '' : 's'}`;
  view.innerHTML = all.map(d => `<div class="card">
    <div class="srcrow"><span class="badge ${esc(d.type)}">${esc(d.test)}</span>
      ${d.qno ? `<span class="qno">Q${esc(d.qno)}</span>` : ''}</div>
    <div class="side"><div class="tag">The question said</div><div class="phrase q">${esc(d.q)}</div></div>
    ${d.qtext ? `<div class="ctx">${mark(d.qtext, d.q)}</div>` : ''}
    <div class="arrow">↓</div>
    <div class="side"><div class="tag">The passage said</div><div class="phrase p">${esc(d.p)}</div></div>
    ${d.ptext ? `<div class="ctx">${mark(d.ptext, d.p)}</div>` : ''}
    ${d.uz ? `<div class="uz">${esc(d.uz)}</div>` : ''}
  </div>`).join('');
}

function render() {
  if (mode === 'cards') renderCards();
  else if (mode === 'match') { matchSel = null; matchLeft = []; renderMatch(); }
  else renderBrowse();
}

reset();
</script>
</body>
</html>
